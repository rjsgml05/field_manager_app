<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kakao Map</title>
  <script>
    var mapReady = false;
    var pendingMarkers = null;
    var pendingLines = null;
    var markerMoveMode = false;
    const KAKAO_DEBUG = false;

    window.__kakaoMapState = window.__kakaoMapState || {
      mapReady: mapReady,
      pendingMarkers: pendingMarkers,
      pendingLines: pendingLines,
      pendingDrawMarkers: null,
      markerMoveMode: markerMoveMode
    };

    window.renderMarkers = function(markers) {
      pendingMarkers = markers;
      window.__kakaoMapState.pendingMarkers = markers;
      if (KAKAO_DEBUG) console.log("renderMarkers pending", Array.isArray(markers) ? markers.length : "unknown");
    };

    window.renderLines = function(lines) {
      pendingLines = lines;
      window.__kakaoMapState.pendingLines = lines;
      if (KAKAO_DEBUG) console.log("renderLines pending", Array.isArray(lines) ? lines.length : "unknown");
    };

    window.setMarkerMoveMode = function(enabled) {
      markerMoveMode = enabled === true || enabled === "true";
      window.__kakaoMapState.markerMoveMode = markerMoveMode;
      if (KAKAO_DEBUG) console.log("setMarkerMoveMode", markerMoveMode);
    };

    window.debugLogToFlutter = function(payload) {
      try {
        if (KAKAO_DEBUG) console.log("KAKAO_MOVE_DEBUG", JSON.stringify(payload));
      } catch (e) {
        if (KAKAO_DEBUG) console.log("debugLogToFlutter failed", e);
      }
    };
  </script>
  <style>
    html,
    body,
    #map {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #f5f5f5;
    }

    .marker-label,
    .line-label,
    .current-location-label {
      background: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.2);
      border-radius: 4px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.22);
      color: #222222;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.25;
      max-width: 180px;
      padding: 4px 7px;
      pointer-events: none;
      white-space: nowrap;
    }

    .line-label {
      background: rgba(255, 255, 255, 0.96);
      border-color: rgba(25, 118, 210, 0.72);
      border-radius: 999px;
      border-width: 2px;
      box-shadow: 0 2px 7px rgba(15, 23, 42, 0.18);
      color: #111827;
      font-size: 12px;
      font-weight: 900;
      line-height: 1.2;
      max-width: 160px;
      overflow: hidden;
      padding: 4px 9px;
      text-overflow: ellipsis;
    }

    .current-location-label {
      border-color: rgba(46, 125, 50, 0.55);
      color: #1b5e20;
    }

    .current-location-marker {
      align-items: center;
      background: rgba(25, 118, 210, 0.18);
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(25, 118, 210, 0.3);
      display: flex;
      height: 32px;
      justify-content: center;
      pointer-events: none;
      width: 32px;
    }

    .current-location-core {
      background: #1a73e8;
      border: 3px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.35), 0 0 0 5px rgba(26, 115, 232, 0.18);
      height: 14px;
      width: 14px;
    }

    .flat-marker-wrap {
      align-items: center;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 24px;
      min-width: 24px;
      padding: 3px;
      pointer-events: auto;
      user-select: none;
    }

    .flat-marker-dot {
      align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.88);
      border-radius: 50%;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.48), 0 1px 3px rgba(0, 0, 0, 0.24);
      display: flex;
      height: 13px;
      justify-content: center;
      line-height: 1;
      padding: 0;
      position: relative;
      width: 13px;
    }

    .flat-marker-check {
      align-items: center;
      background: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.35);
      border-radius: 50%;
      bottom: -2px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.22);
      color: #111111;
      display: flex;
      font-size: 7px;
      font-weight: 900;
      height: 8px;
      justify-content: center;
      line-height: 1;
      pointer-events: none;
      position: absolute;
      right: -2px;
      width: 8px;
    }

    .flat-marker-title {
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(0, 0, 0, 0.12);
      border-radius: 3px;
      color: #222222;
      font-size: 9px;
      font-weight: 700;
      line-height: 1.2;
      margin-top: 1px;
      max-width: 74px;
      overflow: hidden;
      padding: 1px 4px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #map.map-moving .flat-marker-dot,
    body.map-moving .flat-marker-dot,
    #map.map-moving .flat-marker-check,
    body.map-moving .flat-marker-check,
    #map.map-moving .marker-label,
    body.map-moving .marker-label,
    #map.map-moving .line-label,
    body.map-moving .line-label {
      box-shadow: none;
      transition: none;
    }

        .cluster-marker {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border: 2px solid #ffffff;
      border-radius: 50%;
      background: #39f;
      color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 12px;
      font-weight: 900;
      line-height: 1;
      cursor: pointer;
      pointer-events: auto;
      user-select: none;
      box-shadow:
        0 0 0 1px rgba(0, 80, 180, 0.28),
        0 3px 9px rgba(0, 80, 180, 0.32);
      transition: transform 120ms ease, background-color 120ms ease;
    }

    .cluster-marker::before {
      content: "";
      position: absolute;
      inset: -5px;
      border-radius: 50%;
      background: rgba(51, 153, 255, 0.14);
      z-index: -1;
    }

    .cluster-marker.medium {
      width: 41px;
      height: 41px;
      font-size: 13px;
    }

    .cluster-marker.large {
      width: 47px;
      height: 47px;
      font-size: 14px;
    }

    .cluster-marker:active {
      background: #ff2f2f;
      transform: scale(1.14);
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <script>
    window.__kakaoMapState = window.__kakaoMapState || {
      mapReady: false,
      pendingMarkers: null,
      pendingLines: null,
      pendingDrawMarkers: null,
      markerMoveMode: false
    };

    window.renderMarkers = function(markers) {
      window.__kakaoMapState.pendingMarkers = markers;
      if (KAKAO_DEBUG) console.log('renderMarkers pending', Array.isArray(markers) ? markers.length : 'unknown');
    };

    window.renderLines = function(lines) {
      window.__kakaoMapState.pendingLines = lines;
      if (KAKAO_DEBUG) console.log('renderLines pending', Array.isArray(lines) ? lines.length : 'unknown');
    };

    window.setMarkerMoveMode = function(enabled) {
      window.__kakaoMapState.markerMoveMode = enabled === true || enabled === 'true';
      if (KAKAO_DEBUG) console.log('setMarkerMoveMode', window.__kakaoMapState.markerMoveMode);
    };

    var map;
    var mapContainer = null;
    var mapReady = window.__kakaoMapState.mapReady === true;
    var pendingMarkers = window.__kakaoMapState.pendingMarkers;
    var pendingLines = window.__kakaoMapState.pendingLines;
    var pendingDrawMarkers = window.__kakaoMapState.pendingDrawMarkers;
    var markerMap = {};
    var markerOverlayMap = {};
    var markerClusterOverlayMap = {};
    var drawMarkerMap = {};
    var lineMap = {};
    var lineOverlayMap = {};
    var currentLocationMarker = null;
    var currentLocationOverlay = null;
    var markerData = [];
    var lineData = [];
    var selectedLineId = null;
    var isClusterRenderedOnMap = false;
    var LABEL_HIDE_LEVEL = 7;
    var LINE_LABEL_HIDE_LEVEL = 8;
    var CLUSTER_LEVEL = 6;
    var VIEWPORT_RENDER_DEBOUNCE_MS = 120;
    var VIEWPORT_RENDER_PADDING_RATIO = 0.25;
    var viewportRenderTimer = null;
    var mapRedrawAnimationFrame = null;
    var mapRedrawNeedsMarkers = false;
    var mapRedrawNeedsLines = false;
    var latestVisibleBounds = null;
    var isMapInteractingForFlutter = false;
    var mapInteractionEndTimer = null;
    var mapLightweightMode = false;
    var lightweightModeTimer = null;
    var markerMoveMode = window.__kakaoMapState.markerMoveMode === true;
    var activeMarkerDrag = null;
    var markerImageCache = {};
    var suppressNextMapClick = false;
    var suppressMapClickUntil = 0;

      window.setMarkerMoveMode = function(enabled) {
      markerMoveMode = enabled === true || enabled === 'true';
      window.__kakaoMapState.markerMoveMode = markerMoveMode;

      if (KAKAO_DEBUG) console.log('setMarkerMoveMode', markerMoveMode);

      if (markerMoveMode) {
        clearMarkerClusterOverlays();
      }

      if (mapReady && map) {
        scheduleMapRedraw();
      }

      Object.keys(markerMap).forEach(function(id) {
        var marker = markerMap[id];

        if (marker && typeof marker.setDraggable === 'function') {
          marker.setDraggable(markerMoveMode);
          marker.__draggable = markerMoveMode;
        }
      });

      if (!markerMoveMode && activeMarkerDrag) {
        activeMarkerDrag = null;

        if (map && typeof map.setDraggable === 'function') {
          map.setDraggable(true);
        }
      }
    };

    function postToFlutter(channelName, payload) {
      var channel = window[channelName];
      var message = typeof payload === 'string' ? payload : JSON.stringify(payload);

      if (channel && typeof channel.postMessage === 'function') {
        channel.postMessage(message);
      }
    }

    function setMapLightweightMode(enabled) {
      var nextValue = enabled === true;
      if (mapLightweightMode === nextValue) return;
      mapLightweightMode = nextValue;

      var mapEl = document.getElementById('map');
      if (mapEl) {
        mapEl.classList.toggle('map-moving', mapLightweightMode);
      }
      if (document.body) {
        document.body.classList.toggle('map-moving', mapLightweightMode);
      }
    }

    function notifyMapInteractionStart(reason) {
      setMapLightweightMode(true);
      if (isMapInteractingForFlutter) return;
      isMapInteractingForFlutter = true;
      postToFlutter('FlutterChannel', 'mapInteractionStart:' + reason);
      if (KAKAO_DEBUG) console.log('[KAKAO_MAP] interaction start', reason);
    }

    function notifyMapInteractionEnd(reason) {
      setMapLightweightMode(false);
      if (!isMapInteractingForFlutter) return;
      isMapInteractingForFlutter = false;
      postToFlutter('FlutterChannel', 'mapInteractionEnd:' + reason);
      if (KAKAO_DEBUG) console.log('[KAKAO_MAP] interaction end', reason);
    }

    function scheduleMapInteractionEnd(reason, delay) {
      if (mapInteractionEndTimer) clearTimeout(mapInteractionEndTimer);
      if (lightweightModeTimer) clearTimeout(lightweightModeTimer);
      mapInteractionEndTimer = setTimeout(function() {
        mapInteractionEndTimer = null;
        notifyMapInteractionEnd(reason);
      }, delay || 180);
    }

    function sendDebugLog(payload) {
      if (!KAKAO_DEBUG) return;
      try {
        console.log("KAKAO_MOVE_DEBUG", JSON.stringify(payload));
      } catch (e) {
        console.log("debugLogToFlutter failed", e);
      }
      postToFlutter('debugLog', payload);
      postToFlutter('DebugLogChannel', payload);
    }

    window.debugLogToFlutter = sendDebugLog;

    function normalizeItems(items) {
      if (!items) return [];
      if (typeof items === 'string') {
        try {
          return JSON.parse(items);
        } catch (e) {
          return [];
        }
      }
      return Array.isArray(items) ? items : [];
    }

    function renderMarkersNow(markers) {
      markerData = normalizeItems(markers);
      scheduleMapRedraw({ markers: true, lines: false });
    }

    window.renderMarkers = function(markers) {
      if (!mapReady || !map) {
        pendingMarkers = markers;
        window.__kakaoMapState.pendingMarkers = markers;
        if (KAKAO_DEBUG) console.log('renderMarkers pending', Array.isArray(markers) ? markers.length : 'unknown');
        return;
      }
      window.__kakaoMapState.pendingMarkers = null;
      renderMarkersNow(markers);
    };

    function renderLinesNow(lines) {
      lineData = normalizeItems(lines);
      scheduleMapRedraw({ markers: false, lines: true });
    }

    window.renderLines = function(lines) {
      if (!mapReady || !map) {
        pendingLines = lines;
        window.__kakaoMapState.pendingLines = lines;
        if (KAKAO_DEBUG) console.log('renderLines pending', Array.isArray(lines) ? lines.length : 'unknown');
        return;
      }
      window.__kakaoMapState.pendingLines = null;
      renderLinesNow(lines);
    };

    function renderDrawMarkersNow(markers) {
      clearMapItems(drawMarkerMap);
      drawMarkerMap = {};

      normalizeItems(markers).forEach(function(item) {
        var id = String(item.id ?? '');
        drawMarkerMap[id] = new kakao.maps.Marker({
          map: map,
          position: toLatLng(item),
          opacity: Number(item.opacity ?? 0.75)
        });
      });
    }

    window.renderDrawMarkers = function(markers) {
      if (!mapReady || !map) {
        pendingDrawMarkers = markers;
        window.__kakaoMapState.pendingDrawMarkers = markers;
        return;
      }
      window.__kakaoMapState.pendingDrawMarkers = null;
      renderDrawMarkersNow(markers);
    };

    function toLatLng(item) {
      return new kakao.maps.LatLng(
        Number(item.lat ?? item.latitude),
        Number(item.lng ?? item.longitude)
      );
    }

    function clearMapItems(items) {
      Object.keys(items).forEach(function(key) {
        if (items[key] && typeof items[key].setMap === 'function') {
          items[key].setMap(null);
        }
      });
    }

    function updateVisibleBoundsSnapshot() {
      if (!map || typeof map.getBounds !== 'function') return;

      var bounds = map.getBounds();
      var sw = bounds.getSouthWest();
      var ne = bounds.getNorthEast();

      latestVisibleBounds = {
        swLat: sw.getLat(),
        swLng: sw.getLng(),
        neLat: ne.getLat(),
        neLng: ne.getLng()
      };
    }

    function makeLabel(content, className, color) {
      var safeContent = String(content ?? '');
      var style = color ? ' style="border-color: ' + color + ';"' : '';
      return '<div class="' + className + '"' + style + '>' + safeContent + '</div>';
    }

    function makeCurrentLocationContent() {
      var root = document.createElement('div');
      var core = document.createElement('div');

      root.className = 'current-location-marker';
      core.className = 'current-location-core';
      root.appendChild(core);

      return root;
    }

    function textColorForBackground(color) {
      var hex = String(color || '#4CAF50').replace('#', '');
      if (hex.length === 3) {
        hex = hex.split('').map(function(ch) { return ch + ch; }).join('');
      }
      var r = parseInt(hex.substring(0, 2), 16);
      var g = parseInt(hex.substring(2, 4), 16);
      var b = parseInt(hex.substring(4, 6), 16);
      var brightness = (r * 299 + g * 587 + b * 114) / 1000;
      return brightness > 150 ? '#111111' : '#ffffff';
    }

    function makeFlatMarkerContent(item, number, id) {
      var color = String(item.color || '#4CAF50');
      var title = String(item.title ?? item.name ?? '');
      var root = document.createElement('div');
      var dot = document.createElement('div');
      var label = document.createElement('div');
      var isChecked = item.isChecked === true || item.isChecked === 'true' ||
        item.checked === true || item.checked === 'true' ||
        item.isOn === true || item.isOn === 'true';

      root.className = 'flat-marker-wrap';
      dot.className = 'flat-marker-dot';
      label.className = 'flat-marker-title';

      dot.style.backgroundColor = color;
      label.textContent = title;

      if (isChecked) {
        var badge = document.createElement('div');
        badge.className = 'flat-marker-check';
        badge.textContent = '\u2713';
        dot.appendChild(badge);
      }

      root.appendChild(dot);
      if (title) root.appendChild(label);

      root.addEventListener('click', function(event) {
        event.preventDefault();
        event.stopPropagation();
        if (root.__suppressMarkerClick) {
          root.__suppressMarkerClick = false;
          return;
        }
        postToFlutter('MarkerChannel', id);
      });

      return root;
    }

    function getPointerContainerPoint(event) {
      var source = event.touches && event.touches.length ? event.touches[0] :
        (event.changedTouches && event.changedTouches.length ? event.changedTouches[0] : event);
      var rect = (mapContainer || document.getElementById('map')).getBoundingClientRect();
      return {
        x: source.clientX - rect.left,
        y: source.clientY - rect.top
      };
    }

    function suppressMapClickBriefly() {
      suppressNextMapClick = true;
      suppressMapClickUntil = Date.now() + 600;
      setTimeout(function() {
        if (Date.now() >= suppressMapClickUntil) {
          suppressNextMapClick = false;
        }
      }, 650);
    }

    function keepOverlayWrapperClickThrough(content) {
      if (!content) return;
      content.style.pointerEvents = 'auto';

      requestAnimationFrame(function() {
        var wrapper = content.parentElement;
        var steps = 0;

        while (wrapper && wrapper !== mapContainer && steps < 2) {
          wrapper.style.pointerEvents = 'none';
          wrapper = wrapper.parentElement;
          steps++;
        }

        content.style.pointerEvents = 'auto';
      });
    }

    function installMarkerDrag(root, overlay, id, item) {
      root.style.touchAction = 'none';

      function startDrag(event) {
        if (!markerMoveMode || !map) return;

        event.preventDefault();
        event.stopPropagation();

        var projection = map.getProjection();
        var pointer = getPointerContainerPoint(event);
        var overlayPoint = projection.containerPointFromCoords(overlay.getPosition());

        activeMarkerDrag = {
          id: id,
          item: item,
          root: root,
          overlay: overlay,
          offsetX: pointer.x - overlayPoint.x,
          offsetY: pointer.y - overlayPoint.y,
          moved: false
        };

        if (typeof map.setDraggable === 'function') {
          map.setDraggable(false);
        }
      }

      root.addEventListener('mousedown', startDrag);
      root.addEventListener('touchstart', startDrag, { passive: false });
    }

    function moveActiveMarker(event) {
      if (!activeMarkerDrag || !map) return;

      event.preventDefault();

      var projection = map.getProjection();
      var pointer = getPointerContainerPoint(event);
      var point = new kakao.maps.Point(
        pointer.x - activeMarkerDrag.offsetX,
        pointer.y - activeMarkerDrag.offsetY
      );
      var position = projection.coordsFromContainerPoint(point);

      activeMarkerDrag.overlay.setPosition(position);
      activeMarkerDrag.moved = true;
    }

    function endActiveMarkerDrag(event) {
      if (!activeMarkerDrag || !map) return;

      event.preventDefault();

      var drag = activeMarkerDrag;
      activeMarkerDrag = null;

      if (typeof map.setDraggable === 'function') {
        map.setDraggable(true);
      }

      if (!drag.moved) return;

      drag.root.__suppressMarkerClick = true;
      suppressMapClickBriefly();
      var position = drag.overlay.getPosition();
      postMarkerDragEnd(drag.id, drag.item || {}, position);
    }

    function postMarkerDragEnd(id, item, position) {
      var dragItem = item || {};
      var payload = {
        event: 'dragend',
        markerId: id,
        actualMarkerId: dragItem.markerId,
        renderKey: dragItem.renderKey,
        groupName: dragItem.groupName,
        groupKey: dragItem.groupKey,
        scope: dragItem.scope,
        originalMarkerId: dragItem.originalMarkerId,
        sourceMarkerId: dragItem.sourceMarkerId,
        parentMarkerId: dragItem.parentMarkerId,
        updateTarget: dragItem.updateTarget,
        lat: position.getLat(),
        lng: position.getLng()
      };
      if (KAKAO_DEBUG) {
        console.log('MARKER_DRAG_END', {
          markerId: id,
          groupName: dragItem.groupName,
          groupKey: dragItem.groupKey,
          scope: dragItem.scope,
          originalMarkerId: dragItem.originalMarkerId,
          lat: position.getLat(),
          lng: position.getLng()
        });
      }
      try {
        const payloadText = JSON.stringify(payload);
        if (KAKAO_DEBUG) console.log("KAKAO_MOVE_DEBUG " + payloadText);

        if (typeof MarkerDragChannel !== "undefined" && MarkerDragChannel.postMessage) {
          MarkerDragChannel.postMessage(payloadText);
        } else if (window.MarkerDragChannel && window.MarkerDragChannel.postMessage) {
          window.MarkerDragChannel.postMessage(payloadText);
        } else {
          if (KAKAO_DEBUG) console.log("MarkerDragChannel not available " + payloadText);
        }
      } catch (e) {
        console.log("MarkerDragChannel post failed", e);
      }
    }

      function makeClusterContent(cluster) {
      var count = Array.isArray(cluster.items) ? cluster.items.length : 0;
      var root = document.createElement('div');

      root.className = 'cluster-marker';
      root.textContent = String(count);
      root.title = count + '개 마커 보기';

      root.addEventListener('click', function(event) {
        event.preventDefault();
        event.stopPropagation();

        if (!map) return;

        root.style.backgroundColor = '#ff2f2f';
        root.style.transform = 'scale(1.12)';

        var level = Math.max(1, map.getLevel() - 2);

        setTimeout(function() {
          map.setCenter(new kakao.maps.LatLng(cluster.lat, cluster.lng));
          map.setLevel(level);
        }, 70);
      });

      return root;
    }

    function dominantColor(items) {
      var counts = {};
      var bestColor = String((items[0] && items[0].color) || '#4CAF50');
      var bestCount = 0;

      items.forEach(function(item) {
        var color = String(item.color || '#4CAF50');
        counts[color] = (counts[color] || 0) + 1;
        if (counts[color] > bestCount) {
          bestCount = counts[color];
          bestColor = color;
        }
      });

      return bestColor;
    }

    function getPaddedViewportBounds(paddingRatio) {
      if (!map || typeof map.getBounds !== 'function') {
        return null;
      }

      var bounds = map.getBounds();
      var southWest = bounds.getSouthWest();
      var northEast = bounds.getNorthEast();
      var minLat = southWest.getLat();
      var maxLat = northEast.getLat();
      var minLng = southWest.getLng();
      var maxLng = northEast.getLng();
      var latPadding = Math.abs(maxLat - minLat) * paddingRatio;
      var lngPadding = Math.abs(maxLng - minLng) * paddingRatio;

      return {
        minLat: minLat - latPadding,
        maxLat: maxLat + latPadding,
        minLng: minLng - lngPadding,
        maxLng: maxLng + lngPadding
      };
    }

    function getMarkersInsideCurrentViewport(items) {
      var paddedBounds = getPaddedViewportBounds(VIEWPORT_RENDER_PADDING_RATIO);

      if (!paddedBounds) {
        return items.slice();
      }

      return items.filter(function(item) {
        var lat = Number(item.lat ?? item.latitude);
        var lng = Number(item.lng ?? item.longitude);

        if (!Number.isFinite(lat) || !Number.isFinite(lng)) {
          return false;
        }

        return (
          lat >= paddedBounds.minLat &&
          lat <= paddedBounds.maxLat &&
          lng >= paddedBounds.minLng &&
          lng <= paddedBounds.maxLng
        );
      });
    }

    function clusterMarkers(items, level) {
      var visibleItems = getMarkersInsideCurrentViewport(items);

      if (level < CLUSTER_LEVEL || markerMoveMode) {
        return visibleItems.map(function(item) {
          return {
            type: 'marker',
            item: item
          };
        });
      }

      if (!visibleItems.length) {
        return [];
      }

      if (visibleItems.length === 1) {
        return [{
          type: 'marker',
          item: visibleItems[0]
        }];
      }

      var latSum = 0;
      var lngSum = 0;

      visibleItems.forEach(function(item) {
        latSum += Number(item.lat ?? item.latitude);
        lngSum += Number(item.lng ?? item.longitude);
      });

      return [{
        type: 'cluster',
        key: 'cluster_viewport_' + String(level),
        items: visibleItems,
        lat: latSum / visibleItems.length,
        lng: lngSum / visibleItems.length
      }];
    }

        function clearMarkerClusterOverlays() {
      Object.keys(markerClusterOverlayMap).forEach(function(key) {
        var overlay = markerClusterOverlayMap[key];

        if (overlay && typeof overlay.setMap === 'function') {
          overlay.setMap(null);
        }
      });

      markerClusterOverlayMap = {};
    }

      function renderMarkerClusters(clusters) {
      var nextClusterKeys = {};

      clusters.forEach(function(cluster) {
        if (!cluster || cluster.type !== 'cluster' || !cluster.key) return;

        var key = cluster.key;
        nextClusterKeys[key] = true;

        var signature = [
          key,
          cluster.items.length,
          cluster.lat,
          cluster.lng
        ].join('|');

        var overlay = markerClusterOverlayMap[key];

        if (overlay && overlay.__renderSignature === signature) {
          if (overlay.__isShown !== true) {
            overlay.setMap(map);
            overlay.__isShown = true;
          }
          return;
        }

        if (overlay) {
          overlay.setMap(null);
        }

        overlay = new kakao.maps.CustomOverlay({
          map: map,
          position: new kakao.maps.LatLng(cluster.lat, cluster.lng),
          content: makeClusterContent(cluster),
          xAnchor: 0.5,
          yAnchor: 0.5,
          zIndex: 4
        });

        overlay.__renderSignature = signature;
        overlay.__isShown = true;
        markerClusterOverlayMap[key] = overlay;
      });

      Object.keys(markerClusterOverlayMap).forEach(function(key) {
        if (nextClusterKeys[key]) return;

        if (
          markerClusterOverlayMap[key] &&
          typeof markerClusterOverlayMap[key].setMap === 'function'
        ) {
          markerClusterOverlayMap[key].setMap(null);
          markerClusterOverlayMap[key].__isShown = false;
        }

        delete markerClusterOverlayMap[key];
      });
    }

    function markerSignature(item) {
      return [
        item.id ?? '',
        item.displayKey ?? '',
        item.title ?? item.name ?? '',
        item.color ?? '',
        item.isChecked ?? item.checked ?? item.isOn ?? '',
        item.scope ?? '',
        item.groupName ?? '',
        item.originalMarkerId ?? '',
        item.sourceMarkerId ?? '',
        item.parentMarkerId ?? '',
        item.duplicateCount ?? 1
      ].join('|');
    }

    function escapeSvgText(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&apos;');
    }

    function normalizeMarkerColor(color) {
      var value = String(color || '#4CAF50').trim();
      if (!/^#[0-9a-fA-F]{3}([0-9a-fA-F]{3})?$/.test(value)) return '#4CAF50';
      if (value.length === 4) {
        value = '#' + value.charAt(1) + value.charAt(1) + value.charAt(2) + value.charAt(2) + value.charAt(3) + value.charAt(3);
      }
      return value.toUpperCase();
    }

    function markerImageTitle(item) {
      var rawTitle = String(item.title ?? item.name ?? '').trim();
      return rawTitle.length > 8 ? rawTitle.substring(0, 8) : rawTitle;
    }

    function markerImageChecked(item) {
      return item.isChecked === true || item.isChecked === 'true' ||
        item.checked === true || item.checked === 'true' ||
        item.isOn === true || item.isOn === 'true';
    }

    function markerImageKey(item) {
      return [
        normalizeMarkerColor(item.color),
        markerImageTitle(item),
        markerImageChecked(item) ? '1' : '0'
      ].join('|');
    }

    function drawRoundedRect(ctx, x, y, width, height, radius) {
      var r = Math.min(radius, width / 2, height / 2);
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + width - r, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + r);
      ctx.lineTo(x + width, y + height - r);
      ctx.quadraticCurveTo(x + width, y + height, x + width - r, y + height);
      ctx.lineTo(x + r, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function createMarkerImage(item) {
      var cacheKey = markerImageKey(item);
      if (markerImageCache[cacheKey]) return markerImageCache[cacheKey];

      var color = normalizeMarkerColor(item.color);
      var title = markerImageTitle(item);
      var isChecked = markerImageChecked(item);
      var ratio = Math.min(window.devicePixelRatio || 1, 2);
      var dotSize = 13;
      var dotRadius = dotSize / 2;
      var labelFontSize = 9;
      var labelHeight = title ? 13 : 0;
      var measureCanvas = document.createElement('canvas');
      var measureCtx = measureCanvas.getContext('2d');
      measureCtx.font = '700 ' + labelFontSize + 'px Arial, sans-serif';
      var measuredText = title ? Math.ceil(measureCtx.measureText(title).width) : 0;
      var labelWidth = title ? Math.max(16, Math.min(62, measuredText + 8)) : 0;
      var width = Math.ceil(Math.max(26, labelWidth + 4, isChecked ? 30 : 26));
      var height = Math.ceil(dotSize + (title ? labelHeight + 2 : 0) + 4);
      var dotCx = width / 2;
      var dotCy = dotRadius + 2;
      var labelX = (width - labelWidth) / 2;
      var labelY = dotSize + 4;

      var canvas = document.createElement('canvas');
      canvas.width = Math.ceil(width * ratio);
      canvas.height = Math.ceil(height * ratio);
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      var ctx = canvas.getContext('2d');
      ctx.scale(ratio, ratio);

      ctx.fillStyle = color;
      ctx.strokeStyle = '#333333';
      ctx.lineWidth = 1.3;
      ctx.beginPath();
      ctx.arc(dotCx, dotCy, dotRadius - 0.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      if (isChecked) {
        var checkCx = dotCx + 6;
        var checkCy = dotCy - 5;
        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = '#333333';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(checkCx, checkCy, 3.7, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.strokeStyle = '#111111';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(checkCx - 2, checkCy);
        ctx.lineTo(checkCx - 0.4, checkCy + 1.7);
        ctx.lineTo(checkCx + 2.2, checkCy - 1.8);
        ctx.stroke();
      }

      if (title) {
        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = '#444444';
        ctx.lineWidth = 0.8;
        drawRoundedRect(ctx, labelX, labelY, labelWidth, labelHeight, 3);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#111111';
        ctx.font = '700 ' + labelFontSize + 'px Arial, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(title, width / 2, labelY + labelHeight / 2 + 0.4);
      }

      var url = canvas.toDataURL('image/png');
      var image = new kakao.maps.MarkerImage(
        url,
        new kakao.maps.Size(width, height),
        { offset: new kakao.maps.Point(dotCx, dotCy) }
      );

      markerImageCache[cacheKey] = image;
      return image;
    }

    function createKakaoMarker(item, id) {
      var marker = new kakao.maps.Marker({
        map: map,
        position: toLatLng(item),
        image: createMarkerImage(item),
        clickable: true,
        draggable: markerMoveMode
      });
      var lat = Number(item.lat ?? item.latitude);
      var lng = Number(item.lng ?? item.longitude);
      marker.__renderSignature = markerSignature(item);
      marker.__imageKey = markerImageKey(item);
      marker.__lat = lat;
      marker.__lng = lng;
      marker.__item = item;
      marker.__draggable = markerMoveMode;

      kakao.maps.event.addListener(marker, 'click', function() {
        if (markerMoveMode) return;
        postToFlutter('MarkerChannel', id);
      });

      kakao.maps.event.addListener(marker, 'dragend', function() {
        if (!markerMoveMode) return;
        suppressMapClickBriefly();
        postMarkerDragEnd(id, marker.__item || item, marker.getPosition());
      });

      return marker;
    }

      function lineSignature(line, displayState) {
      if (line && line.renderKey !== undefined && line.renderKey !== null) {
        return String(line.renderKey) + '|' + displayState;
      }

      var points = normalizeItems(line.points).map(function(point) {
        return String(point.lat ?? point.latitude) + ',' + String(point.lng ?? point.longitude);
      }).join(';');

      return [
        line.id ?? '',
        line.title ?? line.name ?? '',
        line.description ?? '',
        line.color ?? '',
        line.width ?? '',
        line.opacity ?? '',
        line.style ?? '',
        line.isVisible ?? '',
        normalizeItems(line.markerIds).join(','),
        points,
        displayState
      ].join('|');
    }

    function redrawMarkers() {
      if (!map) return;

      var level = map.getLevel();
      var renderItems = clusterMarkers(markerData, level);
      var clusterItems = renderItems.filter(function(entry) {
        return entry.type === 'cluster';
      });

      var visibleMarkerItems = renderItems
        .filter(function(entry) {
          return entry.type === 'marker';
        })
        .map(function(entry) {
          return entry.item;
        });

      var nextClusterRenderedOnMap = clusterItems.length > 0;
      var clusterDisplayChanged =
        isClusterRenderedOnMap !== nextClusterRenderedOnMap;

      isClusterRenderedOnMap = nextClusterRenderedOnMap;
      renderMarkerClusters(clusterItems);

      var nextIds = {};
      var total = markerData.length;
      var created = 0;
      var reused = 0;
      var moved = 0;
      var imageUpdated = 0;
      var removed = 0;

      visibleMarkerItems.forEach(function(item) {
        var id = String(item.id ?? '');
        if (!id) return;

        nextIds[id] = true;

        var lat = Number(item.lat ?? item.latitude);
        var lng = Number(item.lng ?? item.longitude);
        var signature = markerSignature(item);
        var marker = markerMap[id];

        if (marker) {
          if (marker.__lat !== lat || marker.__lng !== lng) {
            marker.setPosition(toLatLng(item));
            marker.__lat = lat;
            marker.__lng = lng;
            moved++;
          }

          var nextImageKey = markerImageKey(item);

          if (marker.__imageKey !== nextImageKey) {
            marker.setImage(createMarkerImage(item));
            marker.__imageKey = nextImageKey;
            imageUpdated++;
          } else {
            reused++;
          }

          marker.__renderSignature = signature;

          if (
            marker.__draggable !== markerMoveMode &&
            typeof marker.setDraggable === 'function'
          ) {
            marker.setDraggable(markerMoveMode);
            marker.__draggable = markerMoveMode;
          }

          marker.__item = item;

          if (marker.__isShown !== true) {
            marker.setMap(map);
            marker.__isShown = true;
          }

          return;
        }

        marker = createKakaoMarker(item, id);
        marker.__isShown = true;
        markerMap[id] = marker;
        markerOverlayMap[id] = marker;
        created++;
      });

      Object.keys(markerMap).forEach(function(id) {
        if (nextIds[id]) return;

        if (markerMap[id] && typeof markerMap[id].setMap === 'function') {
          markerMap[id].setMap(null);
          markerMap[id].__isShown = false;
        }

        delete markerMap[id];
        delete markerOverlayMap[id];
        removed++;
      });

      if (clusterDisplayChanged) {
        scheduleMapRedraw({ markers: false, lines: true });
      }

      if (KAKAO_DEBUG) {
        console.log('[KAKAO_MARKERS] clustered render', {
          level: level,
          markerMoveMode: markerMoveMode,
          sourceMarkers: total,
          visibleMarkers: visibleMarkerItems.length,
          visibleClusters: clusterItems.length,
          created: created,
          reused: reused,
          moved: moved,
          imageUpdated: imageUpdated,
          removed: removed
        });

        console.log(
          '[KAKAO_MARKERS] image cache size',
          Object.keys(markerImageCache).length
        );
      }
    }

    function redrawLines() {
      if (!map) return;

      if (isClusterRenderedOnMap) {
        selectedLineId = null;

        Object.keys(lineMap).forEach(function(id) {
          var polyline = lineMap[id];

          if (
            polyline &&
            typeof polyline.setMap === 'function' &&
            polyline.__isShown !== false
          ) {
            polyline.setMap(null);
            polyline.__isShown = false;
          }
        });

        Object.keys(lineOverlayMap).forEach(function(id) {
          var labelOverlay = lineOverlayMap[id];

          if (
            labelOverlay &&
            typeof labelOverlay.setMap === 'function' &&
            labelOverlay.__isShown !== false
          ) {
            labelOverlay.setMap(null);
            labelOverlay.__isShown = false;
          }
        });

        return;
      }

      var nextIds = {};
      var total = 0;
      var created = 0;
      var reused = 0;
      var updated = 0;
      var removed = 0;
      var selectedLineStillVisible = false;

      lineData.forEach(function(line) {
        var id = String(line.id ?? '');
        if (!id) return;

        var visible = line.isVisible !== false && line.isVisible !== 'false';
        var rawPoints = normalizeItems(line.points);

        if (!visible || rawPoints.length < 2) return;

        total++;
        nextIds[id] = true;

        var isSelected = selectedLineId === id;
        if (isSelected) {
          selectedLineStillVisible = true;
        }

        var displayState = isSelected ? 'selected' : 'normal';
        var signature = lineSignature(line, displayState);
        var polyline = lineMap[id];
        var points = null;
        var baseStrokeWeight = Number(line.width ?? 4);
        var baseStrokeOpacity = Number(line.opacity ?? 0.9);

        if (!Number.isFinite(baseStrokeWeight) || baseStrokeWeight <= 0) {
          baseStrokeWeight = 4;
        }

        if (!Number.isFinite(baseStrokeOpacity)) {
          baseStrokeOpacity = 0.9;
        }

        if (polyline && polyline.__renderSignature === signature) {
          if (polyline.__isShown !== true) {
            polyline.setMap(map);
            polyline.__isShown = true;
          }
          reused++;
        } else {
          points = rawPoints.map(toLatLng);

          if (polyline) {
            polyline.setMap(null);
            polyline.__isShown = false;
            updated++;
          } else {
            created++;
          }

          polyline = new kakao.maps.Polyline({
            map: map,
            path: points,
            strokeWeight: isSelected
              ? Math.max(baseStrokeWeight + 3, Math.round(baseStrokeWeight * 1.8))
              : baseStrokeWeight,
            strokeColor: String(line.color ?? '#1976D2'),
            strokeOpacity: isSelected ? 1 : baseStrokeOpacity,
            strokeStyle: String(line.style ?? 'solid'),
            zIndex: isSelected ? 5 : 2
          });

          polyline.__renderSignature = signature;
          polyline.__isShown = true;

          kakao.maps.event.addListener(polyline, 'click', function() {
            selectedLineId = id;
            suppressMapClickBriefly();
            scheduleMapRedraw({ markers: false, lines: true });
          });

          lineMap[id] = polyline;
        }

        var shouldShowLineLabel = isSelected;
        var overlay = lineOverlayMap[id];

        if (shouldShowLineLabel) {
          if (points === null) {
            points = rawPoints.map(toLatLng);
          }

          var labelPosition = points[Math.floor(points.length / 2)];
          var labelSignature = signature + '|label|' +
            String(line.title ?? line.name ?? id);

          if (overlay && overlay.__renderSignature === labelSignature) {
            overlay.setPosition(labelPosition);

            if (overlay.__isShown !== true) {
              overlay.setMap(map);
              overlay.__isShown = true;
            }
          } else {
            if (overlay) {
              overlay.setMap(null);
              overlay.__isShown = false;
            }

            overlay = new kakao.maps.CustomOverlay({
              map: map,
              position: labelPosition,
              content: makeLabel(
                line.title ?? line.name ?? id,
                'line-label',
                line.color
              ),
              yAnchor: 0.5,
              zIndex: 4
            });

            overlay.__renderSignature = labelSignature;
            overlay.__isShown = true;
            lineOverlayMap[id] = overlay;
          }
        } else if (overlay && overlay.__isShown === true) {
          overlay.setMap(null);
          overlay.__isShown = false;
        }
      });

      Object.keys(lineMap).forEach(function(id) {
        if (nextIds[id]) return;

        if (lineMap[id] && typeof lineMap[id].setMap === 'function') {
          lineMap[id].setMap(null);
        }

        if (
          lineOverlayMap[id] &&
          typeof lineOverlayMap[id].setMap === 'function'
        ) {
          lineOverlayMap[id].setMap(null);
        }

        delete lineMap[id];
        delete lineOverlayMap[id];
        removed++;
      });

      if (selectedLineId !== null && !selectedLineStillVisible) {
        selectedLineId = null;
      }

      if (KAKAO_DEBUG) {
        console.log('[KAKAO_LINES] diff', {
          total: total,
          created: created,
          reused: reused,
          updated: updated,
          removed: removed
        });
      }
    }

    function scheduleMapRedraw(options) {
      if (!mapReady || !map) return;

      var redrawMarkersRequested = !options || options.markers !== false;
      var redrawLinesRequested = !options || options.lines !== false;

      mapRedrawNeedsMarkers = mapRedrawNeedsMarkers || redrawMarkersRequested;
      mapRedrawNeedsLines = mapRedrawNeedsLines || redrawLinesRequested;

      if (mapRedrawAnimationFrame !== null) return;

      mapRedrawAnimationFrame = requestAnimationFrame(function() {
        var shouldRedrawMarkers = mapRedrawNeedsMarkers;
        var shouldRedrawLines = mapRedrawNeedsLines;

        mapRedrawAnimationFrame = null;
        mapRedrawNeedsMarkers = false;
        mapRedrawNeedsLines = false;

        if (shouldRedrawMarkers) {
          redrawMarkers();
        }
        if (shouldRedrawLines) {
          redrawLines();
        }
      });
    }

    function refreshZoomDependentLayers() {
      if (viewportRenderTimer) {
        clearTimeout(viewportRenderTimer);
        viewportRenderTimer = null;
      }
      updateVisibleBoundsSnapshot();
    }

    function scheduleRefreshZoomDependentLayers() {
      if (!map) return;

      updateVisibleBoundsSnapshot();
      if (viewportRenderTimer) clearTimeout(viewportRenderTimer);

      viewportRenderTimer = setTimeout(function() {
        viewportRenderTimer = null;
        updateVisibleBoundsSnapshot();
      }, VIEWPORT_RENDER_DEBOUNCE_MS);
    }

    function initMap() {
      var container = document.getElementById('map');
      mapContainer = container;
      map = new kakao.maps.Map(container, {
        center: new kakao.maps.LatLng(35.1795, 129.0756),
        level: 5
      });
      updateVisibleBoundsSnapshot();

      kakao.maps.event.addListener(map, 'click', function(mouseEvent) {
        if (suppressNextMapClick || Date.now() < suppressMapClickUntil) {
          suppressNextMapClick = false;
          return;
        }

        if (selectedLineId !== null) {
          selectedLineId = null;
          scheduleMapRedraw({ markers: false, lines: true });
        }

        var latLng = mouseEvent.latLng;
        postToFlutter('MapTapChannel', {
          lat: latLng.getLat(),
          lng: latLng.getLng()
        });
      });

      kakao.maps.event.addListener(map, 'zoom_changed', function() {
        notifyMapInteractionStart('zoom');
        updateVisibleBoundsSnapshot();
        scheduleMapInteractionEnd('zoomIdle', 220);
      });
      kakao.maps.event.addListener(map, 'dragstart', function() {
        notifyMapInteractionStart('drag');
      });
      kakao.maps.event.addListener(map, 'bounds_changed', function() {
        updateVisibleBoundsSnapshot();
      });
      kakao.maps.event.addListener(map, 'center_changed', function() {
        updateVisibleBoundsSnapshot();
      });
      kakao.maps.event.addListener(map, 'dragend', function() {
        scheduleMapInteractionEnd('dragend', 80);
      });
      kakao.maps.event.addListener(map, 'idle', function() {
        updateVisibleBoundsSnapshot();

        // viewport 변화에 따라 표시 마커만 확인한다.
        // 선은 데이터/선택 상태/클러스터 표시 상태가 바뀔 때만 다시 그린다.
        scheduleMapRedraw({ markers: true, lines: false });

        scheduleMapInteractionEnd('idle', 80);
      });
      document.addEventListener('mousemove', moveActiveMarker);
      document.addEventListener('touchmove', moveActiveMarker, { passive: false });
      document.addEventListener('mouseup', endActiveMarkerDrag);
      document.addEventListener('touchend', endActiveMarkerDrag);
      document.addEventListener('touchcancel', endActiveMarkerDrag);

      mapReady = true;
      window.__kakaoMapState.mapReady = true;
      if (pendingMarkers !== null) {
        var markers = pendingMarkers;
        pendingMarkers = null;
        window.__kakaoMapState.pendingMarkers = null;
        window.renderMarkers(markers);
      }
      if (pendingLines !== null) {
        var lines = pendingLines;
        pendingLines = null;
        window.__kakaoMapState.pendingLines = null;
        window.renderLines(lines);
      }
      if (pendingDrawMarkers !== null) {
        var drawMarkers = pendingDrawMarkers;
        pendingDrawMarkers = null;
        window.__kakaoMapState.pendingDrawMarkers = null;
        window.renderDrawMarkers(drawMarkers);
      }

      postToFlutter('FlutterChannel', {
        type: 'mapReady'
      });
    }

    function setMarkerMoveMode(enabled) {
      window.setMarkerMoveMode(enabled);
    }

    function renderMarkers(markers) {
      window.renderMarkers(markers);
    }

    function renderDrawMarkers(markers) {
      window.renderDrawMarkers(markers);
    }

    function renderLines(lines) {
      window.renderLines(lines);
    }

    function moveTo(lat, lng, level) {
      if (!map) return;

      var position = new kakao.maps.LatLng(Number(lat), Number(lng));
      map.setCenter(position);

      if (level !== undefined && level !== null) {
        map.setLevel(Number(level));
      }
    }

    function zoomTo(level) {
      if (!map) return;
      map.setLevel(Number(level));
    }

    function showCurrentLocation(locationOrLat, lng) {
      if (currentLocationMarker) {
        currentLocationMarker.setMap(null);
        currentLocationMarker = null;
      }
      if (currentLocationOverlay) {
        currentLocationOverlay.setMap(null);
        currentLocationOverlay = null;
      }

      var item = locationOrLat;
      if (typeof locationOrLat === 'string') {
        item = JSON.parse(locationOrLat);
      } else if (typeof locationOrLat === 'number' && typeof lng === 'number') {
        item = {
          lat: locationOrLat,
          lng: lng,
          title: '현재 위치',
          moveCamera: false
        };
      }
      if (!item) return;

      var position = toLatLng(item);
      currentLocationOverlay = new kakao.maps.CustomOverlay({
        map: map,
        position: position,
        content: makeCurrentLocationContent(),
        xAnchor: 0.5,
        yAnchor: 0.5
      });

      if (item.moveCamera !== false) {
        map.setCenter(position);
      }
    }

    window.moveTo = moveTo;
    window.moveToLocation = moveTo;
    window.zoomTo = zoomTo;
    window.showCurrentLocation = showCurrentLocation;
  </script>
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=4a2743b9e49b8da391510688eb04d69d&autoload=false"></script>
  <script>
    kakao.maps.load(initMap);
  </script>
