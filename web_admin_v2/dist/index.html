<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Field Manager Admin V2</title>
  <style>
    :root {
      --sidebar-width: 360px;
      --blue: #1976d2;
      --blue-dark: #115293;
      --border: #d9dee7;
      --text: #1f2937;
      --muted: #6b7280;
      --surface: #ffffff;
      --panel: #f8fafc;
      --disabled: #94a3b8;
      --shadow: 0 8px 24px rgba(15, 23, 42, 0.18);
    }

    * { box-sizing: border-box; }

    html,
    body,
    #app {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    html,
    body {
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: #e5e7eb;
    }

    #app {
      display: block;
      min-width: 100vw;
      min-height: 100vh;
    }

    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: var(--sidebar-width);
      min-width: var(--sidebar-width);
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border-right: 1px solid #cfd7e3;
      box-shadow: 2px 0 10px rgba(15, 23, 42, 0.1);
      z-index: 20;
      transform: translateX(0);
      transition: transform 220ms ease;
    }

    #app.sidebar-closed .sidebar {
      transform: translateX(-100%);
    }

    .sidebar-backdrop {
      position: fixed;
      inset: 0;
      z-index: 15;
      background: rgba(15, 23, 42, 0.18);
      opacity: 1;
      pointer-events: auto;
      transition: opacity 220ms ease;
    }

    #app.sidebar-closed .sidebar-backdrop {
      opacity: 0;
      pointer-events: none;
    }

    .sidebar-header {
      padding: 16px;
      background: linear-gradient(180deg, var(--blue), var(--blue-dark));
      color: #fff;
    }

    .sidebar-title {
      margin: 0;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 0;
    }

    .sidebar-subtitle {
      margin: 6px 0 0;
      font-size: 13px;
      opacity: 0.92;
    }

    .sidebar-body {
      flex: 1;
      min-height: 0;
      padding: 10px;
      overflow-y: auto;
    }

    .section {
      margin-bottom: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      overflow: hidden;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 9px 10px;
      border-bottom: 1px solid var(--border);
      background: #fff;
      font-size: 13px;
      font-weight: 900;
    }

    .section-body { padding: 8px; }

    .status-value {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 900;
    }

    .list {
      display: grid;
      gap: 7px;
    }

    .switch-row,
    .team-row,
    .group-row,
    .marker-row,
    .line-row {
      min-width: 0;
      border: 1px solid #e5eaf2;
      border-radius: 7px;
      background: #fff;
    }

    .switch-row {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 8px;
      padding: 8px;
    }

    .team-summary,
    .group-summary,
    .line-summary {
      display: grid;
      grid-template-columns: 18px 1fr auto;
      align-items: center;
      gap: 7px;
      min-height: 36px;
      padding: 7px;
      cursor: pointer;
      list-style: none;
    }

    .team-row {
      background: #ffffff;
    }

    .team-row > .group-row,
    .team-group-row {
      position: relative;
      margin: 0 7px 7px 24px;
      background: #f8fbff;
      border-color: #dbeafe;
    }

    .team-row > .group-row::before,
    .team-group-row::before {
      content: "";
      position: absolute;
      top: -7px;
      bottom: 12px;
      left: -13px;
      width: 2px;
      background: #bfdbfe;
    }

    .team-row > .group-row::after,
    .team-group-row::after {
      content: "";
      position: absolute;
      top: 18px;
      left: -13px;
      width: 12px;
      height: 2px;
      background: #bfdbfe;
    }

    .team-summary::-webkit-details-marker,
    .group-summary::-webkit-details-marker,
    .line-summary::-webkit-details-marker {
      display: none;
    }

    .marker-row {
      display: grid;
      grid-template-columns: 18px 1fr;
      gap: 7px;
      align-items: center;
      margin: 0 7px 6px 32px;
      padding: 6px;
      cursor: pointer;
    }

    .team-row .marker-row,
    .team-marker-row {
      margin-left: 48px;
      background: #fbfdff;
    }

    .team-icon,
    .group-dot,
    .marker-dot,
    .line-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #94a3b8;
      flex: 0 0 auto;
    }

    .group-dot,
    .marker-dot {
      border: 2px solid #fff;
      box-shadow: 0 0 0 1px rgba(15, 23, 42, 0.18);
    }

    .line-dot {
      height: 4px;
      border-radius: 999px;
    }

    .row-main { min-width: 0; }

    .row-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
      font-weight: 800;
    }

    .row-sub {
      margin-top: 2px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .row-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .tiny-button {
      min-width: 32px;
      height: 25px;
      padding: 0 6px;
      border: 1px solid #d7deea;
      border-radius: 6px;
      background: #fff;
      color: #334155;
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
      cursor: pointer;
      transition: background-color 160ms ease, border-color 160ms ease, color 160ms ease, transform 160ms ease;
    }

    .tiny-button.disabled-look {
      color: var(--disabled);
      background: #f8fafc;
    }

    .toggle {
      position: relative;
      width: 42px;
      height: 24px;
      border: 0;
      border-radius: 999px;
      background: #cbd5e1;
      cursor: pointer;
      transition: background-color 160ms ease, border-color 160ms ease, transform 160ms ease;
    }

    .toggle::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.25);
      transition: background-color 160ms ease, transform 160ms ease;
    }

    .toggle.on { background: var(--blue); }
    .toggle.on::after { transform: translateX(18px); }

    .full-button {
      width: 100%;
      height: 36px;
      margin-bottom: 12px;
      border: 0;
      border-radius: 7px;
      background: var(--blue);
      color: #fff;
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
    }

    .empty-text {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .sidebar-footer {
      padding: 10px;
      border-top: 1px solid var(--border);
      background: #fff;
    }

    .message {
      min-height: 32px;
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .logout-button {
      width: 100%;
      height: 34px;
      border: 1px solid #e5e7eb;
      border-radius: 7px;
      background: #f8fafc;
      color: #64748b;
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
    }

    .map-area {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #e8eef7;
    }

    #map {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #e8eef7;
      z-index: 0;
    }

    .map-toolbar {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: calc(100% - 24px);
      padding: 8px;
      border: 1px solid rgba(217, 222, 231, 0.95);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: var(--shadow);
    }

    .sidebar-toggle {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 25;
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.96);
      color: #1f2937;
      font-size: 20px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: left 220ms ease, background-color 160ms ease;
    }

    #app.sidebar-open .sidebar-toggle {
      left: calc(var(--sidebar-width) + 12px);
    }

    .map-button {
      height: 32px;
      padding: 0 11px;
      border: 0;
      border-radius: 7px;
      background: #1f2937;
      color: #fff;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
    }

    .map-button.active {
      background: #f97316;
    }

    .readonly-badge {
      flex: 0 0 auto;
      padding: 7px 9px;
      border-radius: 999px;
      background: #eef4ff;
      color: #1d4ed8;
      font-size: 12px;
      font-weight: 900;
    }

    .info-card {
      position: absolute;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%) translateY(0);
      z-index: 10;
      width: min(640px, calc(100% - 40px));
      max-height: min(58vh, 440px);
      padding: 14px;
      overflow: auto;
      border: 1px solid rgba(217, 222, 231, 0.95);
      border-radius: 16px;
      background: #fff;
      box-shadow: var(--shadow);
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transition: opacity 180ms ease, transform 180ms ease, visibility 180ms ease;
    }

    .info-card.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateX(-50%) translateY(18px);
    }

    .info-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .info-title {
      margin: 0;
      font-size: 15px;
      font-weight: 900;
    }

    .close-button {
      width: 28px;
      height: 28px;
      padding: 0;
      border: 1px solid #d7deea;
      border-radius: 6px;
      background: #fff;
      color: #334155;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
    }

    .marker-title {
      margin: 0 0 10px;
      font-size: 17px;
      font-weight: 900;
    }

    .marker-meta {
      display: grid;
      gap: 7px;
    }

    .info-line {
      display: grid;
      grid-template-columns: 112px 1fr;
      gap: 8px;
      align-items: start;
      padding: 7px;
      border: 1px solid #edf0f5;
      border-radius: 7px;
      background: #fbfcff;
      font-size: 12px;
    }

    .info-key {
      color: var(--muted);
      font-weight: 700;
    }

    .info-value {
      min-width: 0;
      overflow-wrap: anywhere;
      font-weight: 800;
    }

    .flat-marker-wrap {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      user-select: none;
      touch-action: none;
      pointer-events: auto;
      will-change: transform;
    }

    .flat-marker-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid #1f2937;
      box-shadow: 0 1px 4px rgba(15, 23, 42, 0.28);
      background: #4f46e5;
    }

    .flat-marker-title {
      min-width: 18px;
      max-width: 86px;
      margin-top: 2px;
      padding: 2px 5px;
      border: 1px solid #4b5563;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.96);
      color: #111827;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      box-shadow: 0 1px 4px rgba(15, 23, 42, 0.14);
    }

    .flat-marker-check {
      position: absolute;
      top: -5px;
      right: calc(50% - 18px);
      display: flex;
      align-items: center;
      justify-content: center;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid #fff;
      background: #111827;
      color: #fff;
      font-size: 10px;
      font-weight: 900;
      line-height: 1;
      z-index: 2;
      box-shadow: 0 1px 4px rgba(15, 23, 42, 0.28);
    }

    .flat-marker-wrap.marker-focus .flat-marker-dot {
      outline: 3px solid rgba(25, 118, 210, 0.28);
      transform: scale(1.18);
      transition: outline-color 180ms ease, transform 180ms ease;
    }

    .line-label {
      max-width: 160px;
      padding: 3px 8px;
      border: 1px solid rgba(15, 23, 42, 0.16);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: none;
      color: #111827;
      font-size: 12px;
      font-weight: 800;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      box-shadow: 0 2px 7px rgba(15, 23, 42, 0.18);
      pointer-events: none;
    }

    .marker-card {
      display: grid;
      gap: 9px;
    }

    .marker-card-head {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
      align-items: start;
    }

    .marker-card-title {
      min-width: 0;
    }

    .marker-card-title h3 {
      margin: 0 0 4px;
      font-size: 17px;
      font-weight: 900;
      line-height: 1.3;
      color: #1d4ed8;
    }

    .marker-card-subtitle {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .marker-card-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 5px;
    }

    .marker-action {
      min-width: 30px;
      height: 30px;
      padding: 0 7px;
      border: 1px solid #d7deea;
      border-radius: 7px;
      background: #fff;
      color: #334155;
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
      transition: background-color 160ms ease, border-color 160ms ease, transform 120ms ease;
    }

    .marker-action:hover {
      background: #eff6ff;
      border-color: #93c5fd;
    }

    .marker-action:active {
      transform: translateY(1px);
    }

    .marker-address {
      display: flex;
      gap: 7px;
      align-items: flex-start;
      padding: 8px;
      border: 1px solid #e5eaf2;
      border-radius: 8px;
      background: #fbfcff;
      font-size: 13px;
      font-weight: 800;
      line-height: 1.4;
    }

    .marker-primary-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 20px;
      font-weight: 900;
      color: #111827;
    }

    .marker-photo-grid {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .marker-photo {
      width: 72px;
      height: 72px;
      object-fit: cover;
      flex: 0 0 auto;
      border: 1px solid #d7deea;
      border-radius: 8px;
      background: #f1f5f9;
      cursor: zoom-in;
    }

    .photo-lightbox {
      position: fixed;
      inset: 0;
      z-index: 90;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 12px;
      padding: 18px;
      background: rgba(0, 0, 0, 0.86);
    }

    .photo-lightbox-close {
      justify-self: end;
      width: 38px;
      height: 38px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.5);
      color: #fff;
      font-size: 24px;
      line-height: 1;
      cursor: pointer;
    }

    .photo-lightbox-image {
      align-self: center;
      justify-self: center;
      max-width: min(100%, 1120px);
      max-height: calc(100vh - 130px);
      object-fit: contain;
    }

    .photo-lightbox-caption {
      justify-self: center;
      max-width: min(100%, 840px);
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .photo-error {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 96px;
      height: 72px;
      flex: 0 0 auto;
      border: 1px solid #d7deea;
      border-radius: 8px;
      background: #f8fafc;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      text-align: center;
      padding: 6px;
    }

    .marker-description {
      padding: 8px;
      border: 1px solid #e5eaf2;
      border-radius: 8px;
      background: #fff;
      color: #334155;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.45;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .marker-edit-overlay {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(15, 23, 42, 0.42);
    }

    .marker-edit-dialog {
      width: min(520px, 100%);
      max-height: min(720px, calc(100vh - 36px));
      display: grid;
      gap: 12px;
      overflow: auto;
      padding: 18px;
      border: 1px solid rgba(217, 222, 231, 0.95);
      border-radius: 12px;
      background: #fff;
      box-shadow: var(--shadow);
    }

    .marker-edit-title {
      margin: 0;
      font-size: 18px;
      font-weight: 900;
      color: #111827;
    }

    .marker-edit-form {
      display: grid;
      gap: 11px;
    }

    .marker-edit-field {
      display: grid;
      gap: 5px;
      color: #334155;
      font-size: 12px;
      font-weight: 900;
    }

    .marker-edit-input,
    .marker-edit-textarea {
      width: 100%;
      min-width: 0;
      border: 1px solid #d7deea;
      border-radius: 7px;
      background: #fbfcff;
      color: #111827;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
    }

    .marker-edit-input {
      height: 38px;
      padding: 0 10px;
    }

    .marker-edit-textarea {
      min-height: 82px;
      padding: 9px 10px;
      resize: vertical;
    }

    .marker-edit-photo-note {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .marker-edit-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding-top: 2px;
    }

    .marker-edit-button {
      min-width: 84px;
      height: 36px;
      padding: 0 12px;
      border: 1px solid #d7deea;
      border-radius: 7px;
      background: #fff;
      color: #334155;
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
    }

    .marker-edit-button.primary {
      border-color: var(--blue);
      background: var(--blue);
      color: #fff;
    }

    .marker-edit-button:disabled {
      cursor: wait;
      opacity: 0.64;
    }

    @media (max-width: 820px) {
      :root { --sidebar-width: 300px; }
      .sidebar-title { font-size: 18px; }
      .map-toolbar {
        left: 8px;
        right: 8px;
        justify-content: flex-end;
        overflow-x: auto;
      }

      .info-card {
        width: calc(100% - 20px);
        bottom: 12px;
        max-height: 62vh;
      }
    }
  </style>
</head>
<body>
  <div id="app" class="sidebar-open">
    <aside class="sidebar" aria-label="Field Manager Admin V2 sidebar">
      <header class="sidebar-header">
        <h1 class="sidebar-title">통합 관제 시스템 V2</h1>
        <p class="sidebar-subtitle">KakaoMap 관리자</p>
      </header>

      <div class="sidebar-body">
        <section class="section">
          <div class="section-header">Spreadsheet upload</div>
          <div class="section-body">
            <div class="switch-row">
              <div>
                <div class="row-title">관리자 전용 토글</div>
                <div class="row-sub">Placeholder only</div>
              </div>
              <button id="spreadsheetToggle" class="toggle" type="button" aria-label="Spreadsheet placeholder"></button>
            </div>
          </div>
        </section>

        <section class="section">
          <div class="section-header">
            <span>협력사/팀 목록</span>
            <span id="teamTotal" class="status-value">0</span>
          </div>
          <div id="teamList" class="section-body list">
            <p class="empty-text">Loading teams...</p>
          </div>
        </section>

        <section class="section">
          <div class="section-header">
            <span>나의 데이터</span>
            <span id="groupTotal" class="status-value">0</span>
          </div>
          <div id="myGroupList" class="section-body list">
            <p class="empty-text">그룹 없음</p>
          </div>
        </section>

        <button id="addGroupButton" class="full-button" type="button">+ 새 그룹 추가</button>

        <section class="section">
          <div class="section-header">
            <span>선 목록 (Lines)</span>
            <button id="lineToggleButton" class="tiny-button" type="button">-</button>
          </div>
          <div id="lineSectionBody" class="section-body list">
            <p class="empty-text">선 데이터가 없습니다.</p>
          </div>
        </section>
      </div>

      <footer class="sidebar-footer">
        <p id="adminStatusMessage" class="message">Read-only admin map is ready.</p>

    function relayoutMap() {
      if (!map || !window.kakao || !kakao.maps) return;
      map.relayout();

    function initFirebase() {

        firebase.initializeApp(firebaseConfig);

    function initKakaoMap() {
      if (!window.kakao || !kakao.maps || !kakao.maps.load) {
        setMapStatus("SDK error");
        return;
      }

      try {
        kakao.maps.load(function() {

            var container = document.getElementById("map");

      }
    }

    function colorValueToHex(value, fallback) {
      if (typeof value === "string" && value.charAt(0) === "#") return value;
      var numberValue = Number(value);
      if (!Number.isFinite(numberValue)) return fallback || "#4F46E5";
      var hex = (numberValue >>> 0).toString(16).padStart(8, "0");
      return "#" + hex.slice(2).toUpperCase();
    }

    function readBool(value) {
      return value === true || value === "true" || value === 1 || value === "1";
    }

    function markerIdOf(item) {
      return String(item.id || item.markerId || item.originalMarkerId || item.sourceMarkerId || "");
    }

    function normalizeGroups(data) {
      var groups = Array.isArray(data.groups) ? data.groups : [];
      return groups.map(function(group, index) {
        var item = group || {};
        return {
          name: String(item.name || "Group " + (index + 1)),
          color: colorValueToHex(item.colorValue, "#4F46E5"),
          isVisible: item.isVisible !== false
        };
      });
    }

    function makeGroupLookup(groups) {
      var lookup = {};
      groups.forEach(function(group) {
        if (!group || !group.name) return;
        lookup[String(group.name)] = group;
      });
      return lookup;
    }

    function normalizeMarkers(data, teamDocId) {
      var groups = Array.isArray(data.groups) ? data.groups : [];
      var groupLookup = makeGroupLookup(groups);
      var markers = Array.isArray(data.markers) ? data.markers : [];

      return markers.map(function(item, index) {
        var marker = item || {};
        var group = marker.group || {};
        var groupName = String(group.name || marker.groupName || "Default group");
        var groupMeta = groupLookup[groupName] || group;
        var rawId = markerIdOf(marker) || "marker_" + index;

        return {
          id: String(teamDocId || ADMIN_TEAM_DOC_ID) + "::" + rawId,
          rawId: rawId,
          markerId: marker.markerId || marker.id || rawId,
          originalMarkerId: marker.originalMarkerId || "",
          sourceMarkerId: marker.sourceMarkerId || "",
          parentMarkerId: marker.parentMarkerId || "",
          lat: Number(marker.lat),
          lng: Number(marker.lng),
          title: marker.title || marker.name || "Untitled",
          description: marker.description || "",
          address: marker.address || "",
          groupName: groupName,
          teamName: String(teamDocId || ADMIN_TEAM_DOC_ID),
          color: marker.color || colorValueToHex(groupMeta.colorValue, "#4F46E5"),
          isChecked: readBool(marker.isChecked) || readBool(marker.checked) || readBool(marker.isOn),
          photos: normalizePhotos(marker.photos)
        };
      }).filter(function(marker) {
        return marker.id && Number.isFinite(marker.lat) && Number.isFinite(marker.lng);
      });
    }

    function normalizePhotos(photos) {
      if (!Array.isArray(photos)) return [];
      return photos.map(function(photo) {
        if (typeof photo === "string") return { url: photo };
        var item = photo || {};
        return {
          url: item.url || item.downloadUrl || item.thumbnailUrl || item.path || item.filePath || "",
          comment: item.comment || ""
        };
      }).filter(function(photo) {
        return !!photo.url;
      });
    }

    function normalizeLines(data, teamDocId) {
      var lines = Array.isArray(data.lines) ? data.lines : [];
      return lines.map(function(item, index) {
        var line = item || {};
        var points = Array.isArray(line.points) ? line.points.map(function(point) {
          return {
            lat: Number(point && point.lat),
            lng: Number(point && point.lng)
          };
        }).filter(function(point) {
          return Number.isFinite(point.lat) && Number.isFinite(point.lng);
        }) : [];

        return {
          id: String(teamDocId || ADMIN_TEAM_DOC_ID) + "::" + String(line.id || "line_" + index),
          lineId: String(line.id || "line_" + index),
          teamName: String(teamDocId || ADMIN_TEAM_DOC_ID),
          title: line.title || "Untitled line",
          description: line.description || "",
          markerIds: Array.isArray(line.markerIds) ? line.markerIds.map(String) : [],
          points: points,
          color: colorValueToHex(line.colorValue, "#7C3AED"),
          isVisible: line.isVisible !== false
        };
      });
    }

    function normalizeTeam(docId, data) {
      var source = data || {};
      return {
        docId: docId,
        teamName: source.teamName || docId,
        groups: normalizeGroups(source),
        markers: normalizeMarkers(source, docId),
        lines: normalizeLines(source, docId)
      };
    }

    async function loadAdminMarkers() {
      if (!db || !map) return;
      setRefreshEnabled(false);
      setFirebaseStatus("Loading");

      try {
        var snapshot = await db.collection("teams").get();
        applyTeamsSnapshot(snapshot, { fitBounds: !initialAutoFitDone });
        setFirebaseStatus("Ready");
        setAdminMessage("Read-only data refreshed.");
        console.log("[ADMIN_V2] markers loaded", ownTeam.markers.length);
      } catch (error) {
        setFirebaseStatus("Error");
        console.error("[ADMIN_V2] markers load failed", error);
      } finally {
        setRefreshEnabled(true);
      }
    }

    function applyTeamsSnapshot(snapshot, options) {
      options = options || {};
      var teams = [];
      var adminTeam = null;

      snapshot.forEach(function(doc) {
        var team = normalizeTeam(doc.id, doc.data() || {});
        if (doc.id === ADMIN_TEAM_DOC_ID) {
          adminTeam = team;
        } else {
          teams.push(team);
        }
      });

      ownTeam = adminTeam || normalizeTeam(ADMIN_TEAM_DOC_ID, {});
      allTeams = teams;
      syncVisibilityState();
      applyPendingMarkerMutationsToLocalState();
      renderTeams();
      renderMyData();
      renderLines();
      renderMarkers(getVisibleMarkers(), { fitBounds: options.fitBounds === true, preserveViewport: options.fitBounds !== true });
      renderMapLines(getVisibleLines());
      if (options.fitBounds === true && !initialAutoFitDone) initialAutoFitDone = true;
      setMarkerCount(getVisibleMarkers().length);
      setTeamCount(allTeams.length);
    }

    function subscribeAdminTeamsRealtime() {
      if (!db || !map) return;
      if (unsubscribeTeamsSnapshot) unsubscribeTeamsSnapshot();
      setRefreshEnabled(false);
      setFirebaseStatus("Loading");

      unsubscribeTeamsSnapshot = db.collection("teams").onSnapshot(function(snapshot) {
        console.log("[ADMIN_V2_REALTIME] teams snapshot", snapshot.size);
        var shouldFit = !initialAutoFitDone;
        applyTeamsSnapshot(snapshot, { fitBounds: shouldFit });
        setFirebaseStatus("Ready");
        setRefreshEnabled(true);
        if (shouldFit) {
          setAdminMessage("실시간 데이터 연결됨.");
        }
      }, function(error) {
        console.error("[ADMIN_V2_REALTIME] teams snapshot failed", error);
        setFirebaseStatus("Error");
        setRefreshEnabled(true);
        setAdminMessage("실시간 데이터 연결에 실패했습니다.");
      });
    }

    function syncVisibilityState() {
      if (ownTeam) {
        ownTeam.groups.forEach(function(group) {
          var key = groupKey(ownTeam.docId, group.name);
          if (groupVisibility[key] === undefined) groupVisibility[key] = group.isVisible !== false;
        });
        ownTeam.lines.forEach(function(line) {
          if (lineVisibility[line.id] === undefined) lineVisibility[line.id] = line.isVisible !== false;
        });
      }

      allTeams.forEach(function(team) {
        if (teamVisibility[team.docId] === undefined) teamVisibility[team.docId] = true;
        team.groups.forEach(function(group) {
          var key = groupKey(team.docId, group.name);
          if (groupVisibility[key] === undefined) groupVisibility[key] = group.isVisible !== false;
        });
        team.lines.forEach(function(line) {
          if (lineVisibility[line.id] === undefined) lineVisibility[line.id] = line.isVisible !== false;
        });
      });
    }

    function groupKey(teamDocId, groupName) {
      return String(teamDocId) + "::" + String(groupName);
    }

    function getVisibleMarkers() {
      var markers = [];
      if (ownTeam) {
        ownTeam.markers.forEach(function(marker) {
          if (groupVisibility[groupKey(ownTeam.docId, marker.groupName)] !== false) markers.push(marker);
        });
      }

      allTeams.forEach(function(team) {
        if (teamVisibility[team.docId] === false) return;
        team.markers.forEach(function(marker) {
          if (groupVisibility[groupKey(team.docId, marker.groupName)] !== false) markers.push(marker);
        });
      });

      return markers;
    }

    function getVisibleLines() {
      var lines = [];
      if (ownTeam) {
        ownTeam.lines.forEach(function(line) {
          if (lineVisibility[line.id] !== false) lines.push(line);
        });
      }

      allTeams.forEach(function(team) {
        if (teamVisibility[team.docId] === false) return;
        team.lines.forEach(function(line) {
          if (lineVisibility[line.id] !== false) lines.push(line);
        });
      });

      return lines;
    }

    function markerSourceKey(marker) {
      var original = String(marker.originalMarkerId || "").trim();
      var source = String(marker.sourceMarkerId || "").trim();
      var parent = String(marker.parentMarkerId || "").trim();
      if (original) return original;
      if (source) return source;
      if (parent) return parent;
      return "";
    }

    function markerDisplayKey(marker) {
      var sharedKey = markerSourceKey(marker);
      if (sharedKey) return "shared:" + sharedKey;
      var ownId = String(marker.markerId || marker.rawId || marker.id || "").trim();
      return "own:" + String(marker.teamName || marker.docId || ADMIN_TEAM_DOC_ID) + ":" + ownId;
    }

    function markerCoordHash(marker) {
      return Number(marker.lat).toFixed(5) + "," + Number(marker.lng).toFixed(5);
    }

    function isSameMarkerPosition(a, b) {
      return Math.abs(Number(a.lat) - Number(b.lat)) <= 0.00001 &&
        Math.abs(Number(a.lng) - Number(b.lng)) <= 0.00001;
    }

    function markerRenderPriority(marker) {
      return String(marker.teamName || "") === ADMIN_TEAM_DOC_ID ? 0 : 3;
    }

    function mergeMarkerDuplicate(existing, incoming) {
      var representative = markerRenderPriority(incoming) < markerRenderPriority(existing) ? incoming : existing;
      var teams = [].concat(existing.duplicateTeams || [existing.teamName], incoming.duplicateTeams || [incoming.teamName])
        .filter(Boolean);
      var uniqueTeams = Array.from(new Set(teams.map(String))).sort();
      representative.duplicateCount = (existing.duplicateCount || 1) + (incoming.duplicateCount || 1);
      representative.duplicateTeams = uniqueTeams;
      representative.isDeduped = representative.duplicateCount > 1;
      representative.displayKey = existing.displayKey || incoming.displayKey || markerDisplayKey(representative);
      return representative;
    }

    function dedupeVisibleMarkers(markers) {
      var result = [];
      (markers || []).forEach(function(marker) {
        var baseDisplayKey = markerDisplayKey(marker);
        var item = Object.assign({}, marker, {
          displayKey: baseDisplayKey,
          duplicateCount: marker.duplicateCount || 1,
          duplicateTeams: marker.duplicateTeams || [marker.teamName],
          isDeduped: marker.isDeduped === true
        });
        var matchIndex = -1;
        var hasSameBaseKey = false;

        for (var i = 0; i < result.length; i += 1) {
          if (result[i].displayKey !== baseDisplayKey) continue;
          hasSameBaseKey = true;
          if (isSameMarkerPosition(result[i], item)) {
            matchIndex = i;
            break;
          }
        }

        if (matchIndex !== -1) {
          result[matchIndex] = mergeMarkerDuplicate(result[matchIndex], item);
          return;
        }

        if (hasSameBaseKey) item.displayKey = baseDisplayKey + "@" + markerCoordHash(item);
        result.push(item);
      });
      return result;
    }

    function normalizeSharedMarkerId(id) {
      var value = String(id || "").trim();
      if (!value) return "";
      var prefixes = [ADMIN_TEAM_DOC_ID];
      if (ownTeam) prefixes.push(ownTeam.docId, ownTeam.teamName);
      allTeams.forEach(function(team) {
        prefixes.push(team.docId, team.teamName);
      });
      prefixes.filter(Boolean).forEach(function(prefix) {
        var clean = String(prefix);
        [clean + "::", clean + "_", clean + "/", clean + "-"].forEach(function(token) {
          if (value.indexOf(token) === 0) value = value.slice(token.length);
        });
      });
      return value;
    }

    function linePathHash(line) {
      return (line.points || []).map(function(point) {
        return Number(point.lat).toFixed(6) + "," + Number(point.lng).toFixed(6);
      }).join(">");
    }

    function lineDisplayKey(line) {
      var pathHash = linePathHash(line);
      var markerIds = Array.isArray(line.markerIds) ? line.markerIds.map(normalizeSharedMarkerId).filter(Boolean).join(">") : "";
      if (markerIds) return "markers:" + markerIds + "|path:" + pathHash + "|color:" + line.color;
      return "path:" + pathHash + "|color:" + line.color;
    }

    function mergeLineDuplicate(existing, incoming) {
      var representative = String(incoming.teamName || "") === ADMIN_TEAM_DOC_ID ? incoming : existing;
      var teams = [].concat(existing.duplicateTeams || [existing.teamName], incoming.duplicateTeams || [incoming.teamName])
        .filter(Boolean);
      var titles = [].concat(existing.duplicateTitles || [existing.title], incoming.duplicateTitles || [incoming.title])
        .filter(Boolean);
      representative.duplicateCount = (existing.duplicateCount || 1) + (incoming.duplicateCount || 1);
      representative.duplicateTeams = Array.from(new Set(teams.map(String))).sort();
      representative.duplicateTitles = Array.from(new Set(titles.map(String))).sort();
      representative.isDeduped = representative.duplicateCount > 1;
      representative.displayKey = existing.displayKey || incoming.displayKey || lineDisplayKey(representative);
      representative.pathHash = existing.pathHash || incoming.pathHash || linePathHash(representative);
      return representative;
    }

    function dedupeVisibleLines(lines) {
      var result = [];
      (lines || []).forEach(function(line) {
        var pathHash = linePathHash(line);
        var displayKey = lineDisplayKey(line);
        var item = Object.assign({}, line, {
          displayKey: displayKey,
          pathHash: pathHash,
          duplicateCount: line.duplicateCount || 1,
          duplicateTeams: line.duplicateTeams || [line.teamName],
          duplicateTitles: line.duplicateTitles || [line.title],
          isDeduped: line.isDeduped === true
        });
        var matchIndex = -1;
        for (var i = 0; i < result.length; i += 1) {
          if (result[i].displayKey === displayKey) {
            matchIndex = i;
            break;
          }
        }
        if (matchIndex !== -1) {
          result[matchIndex] = mergeLineDuplicate(result[matchIndex], item);
        } else {
          result.push(item);
        }
      });
      return result;
    }

    function markerSignature(marker) {
      return [
        marker.id,
        marker.displayKey,
        marker.title,
        marker.groupName,
        marker.color,
        marker.isChecked ? "checked" : "unchecked",
        marker.duplicateCount || 1,
        marker.address,
        marker.markerId,
        marker.originalMarkerId,
        marker.sourceMarkerId,
        marker.parentMarkerId
      ].join("|");
    }

    function markerLabelText(marker) {
      var text = String(marker.title || marker.name || marker.markerId || marker.rawId || marker.id || "");
      return text.length > 12 ? text.slice(0, 11) + "…" : text;
    }

    function markerImageTitle(marker) {
      var text = String(marker.title || marker.name || marker.markerId || marker.rawId || marker.id || "").trim();
      return text.length > 8 ? text.slice(0, 8) : text;
    }

    function markerImageChecked(marker) {
      return marker.isChecked === true || marker.isChecked === "true" ||
        marker.checked === true || marker.checked === "true" ||
        marker.isOn === true || marker.isOn === "true";
    }

    function normalizeMarkerColor(color) {
      var value = String(color || "#4F46E5").trim();
      if (!/^#[0-9a-fA-F]{3}([0-9a-fA-F]{3})?$/.test(value)) return "#4F46E5";
      if (value.length === 4) {
        value = "#" + value.charAt(1) + value.charAt(1) + value.charAt(2) + value.charAt(2) + value.charAt(3) + value.charAt(3);
      }
      return value.toUpperCase();
    }

    function markerImageKey(marker) {
      return [
        normalizeMarkerColor(marker.color),
        markerImageTitle(marker),
        markerImageChecked(marker) ? "1" : "0"
      ].join("|");
    }

    function createMarkerImage(marker) {
      var cacheKey = markerImageKey(marker);
      if (markerImageCache[cacheKey]) return markerImageCache[cacheKey];

      var color = normalizeMarkerColor(marker.color);
      var title = markerImageTitle(marker);
      var isChecked = markerImageChecked(marker);
      var ratio = Math.min(window.devicePixelRatio || 1, 2);
      var dotSize = 15;
      var dotRadius = dotSize / 2;
      var labelFontSize = 10;
      var labelHeight = title ? 15 : 0;
      var measureCanvas = document.createElement("canvas");
      var measureCtx = measureCanvas.getContext("2d");
      measureCtx.font = "700 " + labelFontSize + "px Arial, sans-serif";
      var measuredText = title ? Math.ceil(measureCtx.measureText(title).width) : 0;
      var labelWidth = title ? Math.max(18, Math.min(70, measuredText + 10)) : 0;
      var width = Math.ceil(Math.max(30, labelWidth + 6, isChecked ? 34 : 30));
      var height = Math.ceil(dotSize + (title ? labelHeight + 3 : 0) + 5);
      var dotCx = width / 2;
      var dotCy = dotRadius + 2;
      var labelX = (width - labelWidth) / 2;
      var labelY = dotSize + 5;

      var canvas = document.createElement("canvas");
      canvas.width = Math.ceil(width * ratio);
      canvas.height = Math.ceil(height * ratio);
      canvas.style.width = width + "px";
      canvas.style.height = height + "px";
      var ctx = canvas.getContext("2d");
      ctx.scale(ratio, ratio);

      ctx.fillStyle = color;
      ctx.strokeStyle = "#333333";
      ctx.lineWidth = 1.3;
      ctx.beginPath();
      ctx.arc(dotCx, dotCy, dotRadius - 0.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      if (isChecked) {
        var checkCx = dotCx + 7;
        var checkCy = dotCy - 5.5;
        ctx.fillStyle = "#ffffff";
        ctx.strokeStyle = "#333333";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(checkCx, checkCy, 4.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.strokeStyle = "#111111";
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(checkCx - 2.2, checkCy);
        ctx.lineTo(checkCx - 0.4, checkCy + 1.9);
        ctx.lineTo(checkCx + 2.5, checkCy - 2);
        ctx.stroke();
      }

      if (title) {
        ctx.fillStyle = "#ffffff";
        ctx.strokeStyle = "#444444";
        ctx.lineWidth = 0.8;
        drawRoundRect(ctx, labelX, labelY, labelWidth, labelHeight, 3);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = "#111111";

    function removeDeletedMarkerPointsFromLines(lines, deletedMarkerIds) {

    function buildMarkerIdentityGraph(source) {

      var ownIdToNodes = {};
      docs.forEach(function(doc) {
        var data = typeof doc.data === "function" ? (doc.data() || {}) : (doc.data || {});
        var docId = cleanMarkerId(doc.id || doc.docId);
        var markers = Array.isArray(data.markers) ? data.markers : [];
        markers.forEach(function(rawMarker, index) {

            key: docId + "#" + index,
            doc: doc,
            docId: docId,
            index: index,
            marker: rawMarker,
            ownIds: markerOwnIds(rawMarker),
            linkIds: markerLinkIds(rawMarker),

    function resolveMarkerComponent(source, initiatingMarker, initiatingDocId) {

      var start = null;

        return { ok: false, reason: "not-found", graph: graph, nodes: [], ids: [] };

      var visited = {};
      var queue = [start];
      visited[start.key] = true;
      while (queue.length) {
        var current = queue.shift();
        Object.keys(current.edges).forEach(function(key) {
          if (visited[key]) return;
          var next = graph.nodes.find(function(node) { return node.key === key; });
          if (!next) return;
          visited[key] = true;
          queue.push(next);

      var componentKeys = {};
      componentNodes.forEach(function(node) { componentKeys[node.key] = true; });
      var ambiguousInside = graph.ambiguous.filter(function(item) {
        return componentKeys[item.docId + "#" + item.index];

      }
      graph.unlinked.forEach(function(item) {

        }
      });

      componentNodes.forEach(function(node) {
        ids = ids.concat(node.ownIds, node.linkIds);

      ids = Array.from(new Set(ids.map(cleanMarkerId).filter(Boolean)));
      console.log("[ADMIN_V2_COMPONENT] resolved", {
        initiatingDoc: docId,
        marker: initiatingMarker && (initiatingMarker.id || initiatingMarker.markerId || initiatingMarker.rawId),
        documents: Array.from(new Set(componentNodes.map(function(node) { return node.docId; }))),

        marker && marker.sourceMarkerId,

    function findAdminOriginalMarkerIndex(markers, marker) {
      if (!Array.isArray(markers) || !marker) return -1;
      if (cleanMarkerId(marker.teamName) && cleanMarkerId(marker.teamName) !== ADMIN_TEAM_DOC_ID) return -1;

      var targets = markerIdCandidates(marker);
      if (!targets.length) return -1;

      for (var i = 0; i < markers.length; i += 1) {
        var item = markers[i] || {};
        var itemIds = [item.id, item.markerId].map(cleanMarkerId).filter(Boolean);
        if (targets.some(function(target) { return itemIds.indexOf(target) !== -1; })) {
          return i;
        }
      }

      for (var j = 0; j < markers.length; j += 1) {
        var candidate = markers[j] || {};
        var hasLinkMetadata = cleanMarkerId(candidate.originalMarkerId) ||
          cleanMarkerId(candidate.sourceMarkerId) ||
          cleanMarkerId(candidate.parentMarkerId);
        if (!hasLinkMetadata && normalizedMarkerMatches(candidate, marker) && rawMarkerPrimaryId(candidate)) {
          return j;

      return -1;

    function setMarkerCheckFields(marker, isChecked) {

      if (Object.prototype.hasOwnProperty.call(marker, "isOn")) marker.isOn = isChecked === true;

      if (!Number.isFinite(fields.lng)) delete fields.lng;

        if (!Object.prototype.hasOwnProperty.call(fields, key)) return;
        if (target[key] !== fields[key]) {
          target[key] = fields[key];
          changed = true;
        }
      });

      if (Object.prototype.hasOwnProperty.call(fields, "isChecked")) {
        var nextChecked = fields.isChecked === true;

            (Object.prototype.hasOwnProperty.call(target, "checked") && target.checked !== nextChecked) ||
            (Object.prototype.hasOwnProperty.call(target, "isOn") && target.isOn !== nextChecked)) {

    function updateConnectedLinePoints(lines, markerIds, point, contextLabel) {
      if (!Array.isArray(lines) || !markerIds || !markerIds.length || !point) return false;
      var idLookup = {};
      markerIds.map(cleanMarkerId).filter(Boolean).forEach(function(id) {
        idLookup[id] = true;

      var changed = false;
      lines.forEach(function(line) {
        if (!line) return;
        var lineMarkerIds = Array.isArray(line.markerIds) ? line.markerIds : [];
        var points = Array.isArray(line.points) ? line.points.slice() : [];
        if (!lineMarkerIds.length) return;
        if (points.length < lineMarkerIds.length) {
          console.warn("[ADMIN_V2_SYNC] updateConnectedLine skip unclear", contextLabel || "", line.id || line.lineId || "");
          return;
        }

        var lineChanged = false;
        for (var i = 0; i < lineMarkerIds.length && i < points.length; i += 1) {
          if (!idLookup[cleanMarkerId(lineMarkerIds[i])]) continue;

    async function syncSharedMarkerCopiesFromAdmin(sourceMarker, changedFields, options) {
      options = options || {};
      console.warn("[ADMIN_V2_SYNC] deprecated syncSharedMarkerCopiesFromAdmin ignored; use commitCanonicalMarkerMutation");
      return { documents: 0, markers: 0 };
      var sourceMarkerId = originalMarkerSyncKey(sourceMarker);
      console.log("[ADMIN_V2_SYNC] source", sourceMarkerId);
      if (!db || !sourceMarkerId) {
        console.warn("[ADMIN_V2_SYNC] linked copy not found", sourceMarkerId);
        return { documents: 0, markers: 0 };
      }

      var snapshot = await db.collection("teams").get();
      var batch = db.batch();
      var batchWrites = 0;
      var updatedDocCount = 0;
      var updatedMarkerCount = 0;
      var commitBatch = async function() {
        if (!batchWrites) return;
        await batch.commit();
        batch = db.batch();
        batchWrites = 0;
      };

      for (var docIndex = 0; docIndex < snapshot.docs.length; docIndex += 1) {
        var doc = snapshot.docs[docIndex];
        if (doc.id === ADMIN_TEAM_DOC_ID) continue;

        var data = doc.data() || {};
        var markers = Array.isArray(data.markers) ? data.markers.slice() : [];
        var lines = Array.isArray(data.lines) ? data.lines.slice() : [];
        var matchedMarkers = [];
        var documentChanged = false;

        for (var markerIndex = 0; markerIndex < markers.length; markerIndex += 1) {
          var rawMarker = markers[markerIndex];
          if (!isLinkedSharedCopy(rawMarker, sourceMarkerId)) continue;

          var updatedMarker = Object.assign({}, rawMarker);
          if (applyMarkerFields(updatedMarker, changedFields)) documentChanged = true;
          markers[markerIndex] = updatedMarker;
          matchedMarkers.push(updatedMarker);
          updatedMarkerCount += 1;
        }

        if (matchedMarkers.length > 1) {
          console.warn("[ADMIN_V2_SYNC] duplicate linked copies", {
            team: doc.id,
            source: sourceMarkerId,
            count: matchedMarkers.length
          });
        }

        if (options.updateConnectedLines === true &&
            Object.prototype.hasOwnProperty.call(changedFields, "lat") &&
            Object.prototype.hasOwnProperty.call(changedFields, "lng")) {
          matchedMarkers.forEach(function(sharedMarker) {
            var lineIds = markerIdCandidates(sharedMarker).concat([sourceMarkerId]);
            if (updateConnectedLinePoints(lines, lineIds, { lat: changedFields.lat, lng: changedFields.lng }, doc.id)) {
              documentChanged = true;
            }
          });
        }

        if (!documentChanged) continue;

        var updatePayload = { markers: markers };
        if (options.updateConnectedLines === true) updatePayload.lines = lines;
        batch.update(doc.ref, updatePayload);
        batchWrites += 1;
        updatedDocCount += 1;
        if (batchWrites >= 450) await commitBatch();
      }

      await commitBatch();

      if (!updatedMarkerCount) console.warn("[ADMIN_V2_SYNC] linked copy not found", sourceMarkerId);
      console.log("[ADMIN_V2_SYNC] updated copies", { documents: updatedDocCount, markers: updatedMarkerCount });
      return { documents: updatedDocCount, markers: updatedMarkerCount };
    }

    function applyCanonicalSyncLocally(sourceMarker, fields, options, message) {
      options = options || {};
      var updatedMarker = null;
      var point = Object.prototype.hasOwnProperty.call(fields, "lat") &&
        Object.prototype.hasOwnProperty.call(fields, "lng")
        ? { lat: fields.lat, lng: fields.lng }
        : null;
      var localDocs = [];
      if (ownTeam) {
        localDocs.push({
          id: ownTeam.docId || ADMIN_TEAM_DOC_ID,
          data: { markers: ownTeam.markers, lines: ownTeam.lines }
        });
      }
      allTeams.forEach(function(team) {
        if (ownTeam && cleanMarkerId(team.docId) === cleanMarkerId(ownTeam.docId)) return;
        localDocs.push({
          id: team.docId,
          data: { markers: team.markers, lines: team.lines }
        });
      });
      var component = resolveMarkerComponent(localDocs, sourceMarker, sourceMarker && sourceMarker.teamName);

      if (component.ok) {
        component.nodes.forEach(function(node) {
          applyMarkerFields(node.marker, fields);
          updatedMarker = node.marker;
          if (point && options.updateConnectedLines === true) {
            var data = typeof node.doc.data === "function" ? (node.doc.data() || {}) : (node.doc.data || {});
            updateConnectedLinePoints(data.lines, markerIdCandidates(node.marker).concat(component.ids), point, node.docId);
          }
        });
      } else if (ownTeam) {
        ownTeam.markers.forEach(function(item) {
          if (!normalizedMarkerMatches(item, sourceMarker)) return;
          applyMarkerFields(item, fields);
          updatedMarker = item;
        });
      }

      renderMyData();
      renderTeams();
      renderLines();
      renderMarkers(getVisibleMarkers(), { fitBounds: false, preserveViewport: true });
      renderMapLines(getVisibleLines());
      setMarkerCount(getVisibleMarkers().length);
      if (updatedMarker && !document.getElementById("infoCard").classList.contains("hidden")) {
        showMarkerInfo(updatedMarker);
      }
      if (message) setAdminMessage(message);
      return updatedMarker;
    }

    function applyPendingMarkerMutationsToLocalState() {
      Object.keys(pendingMarkerMutations).forEach(function(key) {
        var pending = pendingMarkerMutations[key];
        if (!pending) return;
        applyCanonicalSyncLocally(
          pending.initiatingMarker || { rawId: key },
          pending.fields || {},
          { updateConnectedLines: pending.updateConnectedLines === true, silent: true },
          ""
        );
      });
    }

    function findRawMarkerIndexByCanonical(markers, canonicalId) {
      if (!Array.isArray(markers) || !canonicalId) return -1;
      for (var i = 0; i < markers.length; i += 1) {
        var item = markers[i] || {};
        if (ownedMarkerCanonicalId(item) === canonicalId) return i;
      }
      return -1;
    }

    function findRawMarkerIndexForInitiating(markers, initiatingMarker) {
      if (!Array.isArray(markers) || !initiatingMarker) return -1;
      var targets = markerIdCandidates(initiatingMarker);
      for (var i = 0; i < markers.length; i += 1) {
        var item = markers[i] || {};
        var itemIds = [item.id, item.markerId].map(cleanMarkerId).filter(Boolean);
        if (targets.some(function(target) { return itemIds.indexOf(target) !== -1; })) return i;
      }
      return -1;
    }

    function buildCanonicalFieldsFromSource(sourceMarker, changedState) {
      var fields = canonicalMarkerFields(sourceMarker, {});
      Object.keys(changedState || {}).forEach(function(key) {
        if (["lat", "lng", "title", "description", "address", "isChecked"].indexOf(key) === -1) return;
        if ((key === "description" || key === "address") &&
            !Object.prototype.hasOwnProperty.call(sourceMarker || {}, key) &&
            !Object.prototype.hasOwnProperty.call(changedState || {}, key)) return;
        fields[key] = changedState[key];
      });
      return fields;
    }

    async function commitCanonicalMarkerMutation(args) {
      var initiatingMarker = args.initiatingMarker;
      var changedState = args.changedState || {};
      var updateConnectedLines = args.updateConnectedLines === true;
      var mutationType = args.mutationType || "marker";
      if (!db || !initiatingMarker) {
        setAdminMessage("연결된 마커 식별자를 찾을 수 없습니다.");
        return false;
      }

      var componentSnapshot = await db.collection("teams").get();
      var component = resolveMarkerComponent(componentSnapshot, initiatingMarker, initiatingMarker.teamName);
      if (!component.ok) {
        setAdminMessage(component.reason === "ambiguous" ? "공유 마커 연결이 모호하여 저장하지 못했습니다." : "수정할 마커를 찾을 수 없습니다.");
        return false;
      }

      var componentTargetByDoc = {};
      component.nodes.forEach(function(node) {
        if (!componentTargetByDoc[node.docId]) {
          componentTargetByDoc[node.docId] = { doc: node.doc, markerIndexes: [] };
        }
        if (componentTargetByDoc[node.docId].markerIndexes.indexOf(node.index) === -1) {
          componentTargetByDoc[node.docId].markerIndexes.push(node.index);
        }
      });

      var componentTargets = Object.keys(componentTargetByDoc).map(function(key) {
        return componentTargetByDoc[key];
      });
      if (!componentTargets.length) {
        setAdminMessage("수정할 마커를 찾을 수 없습니다.");
        return false;
      }
      if (componentTargets.length > 450) {
        setAdminMessage("동기화 대상이 너무 많아 저장을 중단했습니다.");
        console.error("[ADMIN_V2_MUTATION] too many documents", componentTargets.length);
        return false;
      }

      var componentSource = Object.assign({}, component.start ? component.start.marker : initiatingMarker, changedState);
      var componentFields = buildCanonicalFieldsFromSource(componentSource, changedState);
      console.log("[ADMIN_V2_MUTATION]", mutationType, component.ids[0] || "", componentFields);

      var componentBatch = db.batch();
      var componentWrites = 0;
      componentTargets.forEach(function(target) {
        var data = target.doc.data() || {};
        var markers = Array.isArray(data.markers) ? data.markers.slice() : [];
        var lines = Array.isArray(data.lines) ? data.lines.slice() : [];
        var documentChanged = false;

        target.markerIndexes.forEach(function(markerIndex) {
          var rawMarker = Object.assign({}, markers[markerIndex] || {});
          if (applyMarkerFields(rawMarker, componentFields)) documentChanged = true;
          markers[markerIndex] = rawMarker;

          if (updateConnectedLines &&
              Object.prototype.hasOwnProperty.call(componentFields, "lat") &&
              Object.prototype.hasOwnProperty.call(componentFields, "lng")) {
            var ids = markerIdCandidates(rawMarker).concat(component.ids);
            if (updateConnectedLinePoints(lines, ids, { lat: componentFields.lat, lng: componentFields.lng }, target.doc.id)) {
              documentChanged = true;
            }
          }
        });

        if (!documentChanged) return;
        var payload = { markers: markers };
        if (updateConnectedLines) payload.lines = lines;
        componentBatch.update(target.doc.ref, payload);
        componentWrites += 1;
      });

      if (!componentWrites) return true;
      await componentBatch.commit();
      return true;

      var canonicalId = initiatingMarkerCanonicalId(initiatingMarker);

      if (!db || !canonicalId) {
        setAdminMessage("연결된 마커 식별자를 찾을 수 없습니다.");
        return false;
      }

      var snapshot = await db.collection("teams").get();
      var docs = [];
      snapshot.forEach(function(doc) {
        docs.push(doc);
      });

      var ownerDoc = null;
      var ownerMarkerIndex = -1;
      var initiatingDoc = null;
      var initiatingMarkerIndex = -1;
      var linkedTargets = [];
      var isSharedInitiator = !!sharedMarkerCanonicalId(initiatingMarker);

      docs.forEach(function(doc) {
        var data = doc.data() || {};
        var markers = Array.isArray(data.markers) ? data.markers : [];
        var ownedIndex = findRawMarkerIndexByCanonical(markers, canonicalId);
        if (ownedIndex !== -1 && !ownerDoc &&
            (isSharedInitiator || cleanMarkerId(doc.id) === cleanMarkerId(initiatingMarker.teamName))) {
          ownerDoc = doc;
          ownerMarkerIndex = ownedIndex;
        }

        if (cleanMarkerId(doc.id) === cleanMarkerId(initiatingMarker.teamName)) {
          initiatingDoc = doc;
          initiatingMarkerIndex = findRawMarkerIndexForInitiating(markers, initiatingMarker);
        }

        markers.forEach(function(rawMarker, index) {
          if (isLinkedSharedCopy(rawMarker, canonicalId)) {
            linkedTargets.push({ doc: doc, index: index });
          }
        });
      });

      if (isSharedInitiator && !ownerDoc) {
        setAdminMessage("연결된 원본 마커를 찾을 수 없습니다.");
        console.warn("[ADMIN_V2_MUTATION] source owner not found", canonicalId);
        return false;
      }

      var targetByDoc = {};
      var addTarget = function(doc, index) {
        if (!doc || index < 0) return;
        if (!targetByDoc[doc.id]) targetByDoc[doc.id] = { doc: doc, markerIndexes: [] };
        if (targetByDoc[doc.id].markerIndexes.indexOf(index) === -1) {
          targetByDoc[doc.id].markerIndexes.push(index);
        }
      };

      if (ownerDoc) addTarget(ownerDoc, ownerMarkerIndex);
      linkedTargets.forEach(function(target) {
        addTarget(target.doc, target.index);
      });

      if (!ownerDoc && !linkedTargets.length && initiatingDoc && initiatingMarkerIndex !== -1) {
        addTarget(initiatingDoc, initiatingMarkerIndex);
      }

      var targets = Object.keys(targetByDoc).map(function(key) { return targetByDoc[key]; });
      if (!targets.length) {
        setAdminMessage("수정할 마커를 찾을 수 없습니다.");
        return false;
      }
      if (targets.length > 450) {
        setAdminMessage("동기화 대상이 너무 많아 저장을 중단했습니다.");
        console.error("[ADMIN_V2_MUTATION] too many documents", targets.length);
        return false;
      }

      var ownerData = ownerDoc ? (ownerDoc.data() || {}) : (initiatingDoc ? (initiatingDoc.data() || {}) : {});
      var ownerMarkers = Array.isArray(ownerData.markers) ? ownerData.markers : [];
      var canonicalSource = ownerDoc && ownerMarkerIndex !== -1
        ? Object.assign({}, ownerMarkers[ownerMarkerIndex])
        : Object.assign({}, initiatingMarker);
      var canonicalFields = buildCanonicalFieldsFromSource(Object.assign({}, canonicalSource, changedState), changedState);
      console.log("[ADMIN_V2_MUTATION]", mutationType, canonicalId, canonicalFields);

      var batch = db.batch();
      var writes = 0;
      targets.forEach(function(target) {
        var data = target.doc.data() || {};
        var markers = Array.isArray(data.markers) ? data.markers.slice() : [];
        var lines = Array.isArray(data.lines) ? data.lines.slice() : [];
        var documentChanged = false;

        target.markerIndexes.forEach(function(markerIndex) {
          var rawMarker = Object.assign({}, markers[markerIndex] || {});
          if (applyMarkerFields(rawMarker, canonicalFields)) documentChanged = true;
          markers[markerIndex] = rawMarker;

          if (updateConnectedLines &&
              Object.prototype.hasOwnProperty.call(canonicalFields, "lat") &&
              Object.prototype.hasOwnProperty.call(canonicalFields, "lng")) {
            var ids = markerIdCandidates(rawMarker).concat([canonicalId]);
            if (updateConnectedLinePoints(lines, ids, { lat: canonicalFields.lat, lng: canonicalFields.lng }, target.doc.id)) {
              documentChanged = true;
            }
          }
        });

        if (!documentChanged) return;
        var payload = { markers: markers };
        if (updateConnectedLines) payload.lines = lines;
        batch.update(target.doc.ref, payload);
        writes += 1;
      });

      if (!writes) return true;
      await batch.commit();
      return true;
    }

    async function commitCanonicalMarkerDeletion(args) {
      var initiatingMarker = args && args.initiatingMarker;
      if (!db || !initiatingMarker) {
        setAdminMessage("삭제할 마커를 찾을 수 없습니다.");
        return false;
      }

      try {
        var snapshot = await db.collection("teams").get();
        var component = resolveMarkerComponent(snapshot, initiatingMarker, initiatingMarker.teamName);
        if (!component.ok) {
          setAdminMessage(component.reason === "ambiguous"
            ? "공유 마커 연결이 모호하여 삭제하지 못했습니다."
            : "삭제할 마커를 찾을 수 없습니다.");
          return false;
        }

        var targetByDoc = {};
        component.nodes.forEach(function(node) {
          if (!targetByDoc[node.docId]) targetByDoc[node.docId] = { doc: node.doc, markerIndexes: [] };
          if (targetByDoc[node.docId].markerIndexes.indexOf(node.index) === -1) {
            targetByDoc[node.docId].markerIndexes.push(node.index);
          }
        });

        var targets = Object.keys(targetByDoc).map(function(key) { return targetByDoc[key]; });
        if (!targets.length) {
          setAdminMessage("삭제할 마커를 찾을 수 없습니다.");
          return false;
        }
        if (targets.length > 450) {
          setAdminMessage("동기화 대상이 너무 많아 삭제를 중단했습니다.");
          console.error("[ADMIN_V2_DELETE] too many documents", targets.length);
          return false;
        }

        var batch = db.batch();
        var removedCount = 0;
        var changedLineCount = 0;
        var affectedDocIds = [];
        var componentIds = Array.isArray(component.ids) ? component.ids.map(cleanMarkerId).filter(Boolean) : [];
        targets.forEach(function(target) {
          var data = target.doc.data() || {};
          var markers = Array.isArray(data.markers) ? data.markers.slice() : [];
          var lines = Array.isArray(data.lines) ? data.lines.slice() : [];
          var indexes = target.markerIndexes.slice().sort(function(a, b) { return b - a; });
          var deletedIdMap = {};
          var deletedIds = [];
          var changed = false;

          indexes.forEach(function(index) {
            if (index < 0 || index >= markers.length) return;
            markerIdentityIds(markers[index]).forEach(function(id) {
              if (deletedIdMap[id]) return;
              deletedIdMap[id] = true;
              deletedIds.push(id);
            });
            markers.splice(index, 1);
            removedCount += 1;
            changed = true;
          });

          if (!changed) return;
          lines.forEach(function(line) {
            var lineMarkerIds = Array.isArray(line && line.markerIds) ? line.markerIds : [];
            lineMarkerIds.forEach(function(lineMarkerId) {
              var cleaned = cleanMarkerId(lineMarkerId);
              if (!cleaned || deletedIdMap[cleaned] || componentIds.indexOf(cleaned) === -1) return;
              deletedIdMap[cleaned] = true;
              deletedIds.push(cleaned);
            });
          });

          var lineResult = removeDeletedMarkerPointsFromLines(lines, deletedIds);
          if (lineResult.changed) changedLineCount += lineResult.changedLineCount;

          affectedDocIds.push(target.doc.id);
          var updatePayload = { markers: markers };
          if (lineResult.changed) updatePayload.lines = lineResult.lines;
          batch.update(target.doc.ref, updatePayload);
        });

        if (!removedCount) {
          setAdminMessage("삭제할 마커를 찾을 수 없습니다.");
          return false;
        }

        console.log("[ADMIN_V2_DELETE] component", {
          documents: affectedDocIds,
          markersRemoved: removedCount,
          linesChanged: changedLineCount
        });
        await batch.commit();
        console.log("[ADMIN_V2_DELETE] committed");
        return true;
      } catch (error) {
        console.error("[ADMIN_V2_DELETE] failed", error);
        setAdminMessage("마커 삭제에 실패했습니다.");
        return false;
      }
    }

    async function saveMovedMarkerPosition(marker, lat, lng) {
      if (!db) return false;
      setAdminMessage("마커 위치 저장 중...");
      var canonicalId = initiatingMarkerCanonicalId(marker);
      var sequence = ++markerMutationSequence;
      var fields = canonicalMarkerFields(Object.assign({}, marker, { lat: lat, lng: lng }), marker);
      pendingMarkerMutations[canonicalId] = {
        seq: sequence,
        initiatingMarker: marker,
        fields: fields,
        updateConnectedLines: true
      };
      applyCanonicalSyncLocally(marker, fields, { updateConnectedLines: true }, "마커 위치 저장 중...");

      try {
        var saved = await commitCanonicalMarkerMutation({
          initiatingMarker: marker,
          changedState: { lat: lat, lng: lng },
          updateConnectedLines: true,
          mutationType: "move"
        });
        if (!saved) throw new Error("marker move target not found");
        if (pendingMarkerMutations[canonicalId] && pendingMarkerMutations[canonicalId].seq === sequence) {
          delete pendingMarkerMutations[canonicalId];
        }
        setAdminMessage("마커 위치가 저장되었습니다.");
        console.log("[ADMIN_V2_MARKER_MOVE] updated", marker.markerId || marker.rawId || marker.id, lat, lng);
        return true;
      } catch (error) {
        console.error("[ADMIN_V2_MARKER_MOVE] update failed", error);
        if (pendingMarkerMutations[canonicalId] && pendingMarkerMutations[canonicalId].seq === sequence) {
          delete pendingMarkerMutations[canonicalId];
          loadAdminMarkers();
        }
        setAdminMessage("마커 위치 저장 실패");
        return false;
      }
    }

    function applyMarkerMoveLocally(marker, lat, lng) {
      var fields = canonicalMarkerFields(Object.assign({}, marker, { lat: lat, lng: lng }), marker);
      return applyCanonicalSyncLocally(marker, fields, { updateConnectedLines: true }, "마커 위치가 저장되었습니다.");
    }

    function applyMarkerDeletionLocally(marker) {
      var localDocs = [];
      if (ownTeam) {
        localDocs.push({
          id: ownTeam.docId || ADMIN_TEAM_DOC_ID,
          data: { markers: ownTeam.markers, lines: ownTeam.lines }
        });
      }
      allTeams.forEach(function(team) {
        if (ownTeam && cleanMarkerId(team.docId) === cleanMarkerId(ownTeam.docId)) return;
        localDocs.push({
          id: team.docId,
          data: { markers: team.markers, lines: team.lines }
        });
      });

      var component = resolveMarkerComponent(localDocs, marker, marker && marker.teamName);
      if (component.ok) {
        var byDoc = {};
        component.nodes.forEach(function(node) {
          if (!byDoc[node.docId]) byDoc[node.docId] = [];
          byDoc[node.docId].push(node.index);
        });
        localDocs.forEach(function(doc) {
          var indexes = (byDoc[doc.id] || []).sort(function(a, b) { return b - a; });
          indexes.forEach(function(index) {
            if (index >= 0 && index < doc.data.markers.length) doc.data.markers.splice(index, 1);
          });
        });
      } else if (ownTeam) {
        for (var i = ownTeam.markers.length - 1; i >= 0; i -= 1) {
          if (normalizedMarkerMatches(ownTeam.markers[i], marker)) ownTeam.markers.splice(i, 1);
        }
      }

      renderMyData();
      renderTeams();
      renderLines();
      renderMarkers(getVisibleMarkers(), { fitBounds: false, preserveViewport: true });
      renderMapLines(getVisibleLines());
      setMarkerCount(getVisibleMarkers().length);
    }

    function findEditableOwnMarker(marker) {
      if (!marker) return null;

      if (ownTeam) {
        for (var i = 0; i < ownTeam.markers.length; i += 1) {
          if (normalizedMarkerMatches(ownTeam.markers[i], marker)) {
            return ownTeam.markers[i];
          }
        }
      }
      for (var teamIndex = 0; teamIndex < allTeams.length; teamIndex += 1) {
        var team = allTeams[teamIndex];
        if (cleanMarkerId(marker.teamName) && cleanMarkerId(marker.teamName) !== cleanMarkerId(team.docId)) continue;
        for (var markerIndex = 0; markerIndex < team.markers.length; markerIndex += 1) {
          if (normalizedMarkerMatches(team.markers[markerIndex], marker)) {
            return team.markers[markerIndex];
          }
        }
      }
      return null;
    }

    async function updateMarkerDetails(marker, updates) {
      if (!db) return false;

      var editableMarker = findEditableOwnMarker(marker);
      if (!editableMarker) {
        setAdminMessage("수정할 마커를 찾을 수 없습니다.");
        return false;
      }
      var canonicalId = initiatingMarkerCanonicalId(editableMarker);
      var sequence = ++markerMutationSequence;
      var optimisticFields = canonicalMarkerFields(Object.assign({}, editableMarker, updates), editableMarker);
      pendingMarkerMutations[canonicalId] = {
        seq: sequence,
        initiatingMarker: editableMarker,
        fields: optimisticFields,
        updateConnectedLines: true
      };
      applyCanonicalSyncLocally(editableMarker, optimisticFields, { updateConnectedLines: true }, "마커 정보 저장 중...");

      try {
        var saved = await commitCanonicalMarkerMutation({
          initiatingMarker: editableMarker,
          changedState: updates,
          updateConnectedLines: true,
          mutationType: "details"
        });
        if (!saved) throw new Error("marker edit target not found");
        if (pendingMarkerMutations[canonicalId] && pendingMarkerMutations[canonicalId].seq === sequence) {
          delete pendingMarkerMutations[canonicalId];
        }
        setAdminMessage("마커 정보가 수정되었습니다.");
        console.log("[ADMIN_V2_MARKER_EDIT] updated", editableMarker.markerId || editableMarker.rawId || editableMarker.id);
        return true;
      } catch (error) {
        console.error("[ADMIN_V2_MARKER_EDIT] update failed", error);
        if (pendingMarkerMutations[canonicalId] && pendingMarkerMutations[canonicalId].seq === sequence) {
          delete pendingMarkerMutations[canonicalId];
          loadAdminMarkers();
        }
        setAdminMessage("마커 정보 수정에 실패했습니다.");
        return false;
      }
    }

    async function updateMarkerCheck(marker, nextValue) {
      if (!db) return;
      var canonicalId = initiatingMarkerCanonicalId(marker);
      var sequence = ++markerMutationSequence;
      var optimisticFields = canonicalMarkerFields(Object.assign({}, marker, { isChecked: nextValue === true }), marker);
      optimisticFields.isChecked = nextValue === true;
      pendingMarkerMutations[canonicalId] = {
        seq: sequence,
        initiatingMarker: marker,
        fields: optimisticFields,
        updateConnectedLines: true
      };
      applyCanonicalSyncLocally(marker, optimisticFields, { updateConnectedLines: true }, "마커 ON/OFF 저장 중...");

      try {
        var saved = await commitCanonicalMarkerMutation({
          initiatingMarker: marker,
          changedState: { isChecked: nextValue === true },
          updateConnectedLines: true,
          mutationType: "check"
        });
        if (!saved) throw new Error("marker check target not found");
        if (pendingMarkerMutations[canonicalId] && pendingMarkerMutations[canonicalId].seq === sequence) {
          delete pendingMarkerMutations[canonicalId];
        }
        console.log("[ADMIN_V2_MARKER_CHECK] updated", marker.markerId || marker.rawId || marker.id, nextValue === true);
        setAdminMessage("마커 ON/OFF가 업데이트되었습니다.");
      } catch (error) {
        console.error("[ADMIN_V2_MARKER_CHECK] update failed", error);
        if (pendingMarkerMutations[canonicalId] && pendingMarkerMutations[canonicalId].seq === sequence) {
          delete pendingMarkerMutations[canonicalId];
          loadAdminMarkers();
        }
        setAdminMessage("ON/OFF 업데이트 실패");
      }
    }

    function markerMatches(item, marker) {
      if (!item || !marker) return false;
      var candidates = [
        item.id,
        item.rawId,
        item.markerId,
        item.originalMarkerId,
        item.sourceMarkerId,
        item.parentMarkerId
      ].filter(Boolean).map(String);

      var targets = [
        marker.rawId,
        marker.markerId,
        marker.originalMarkerId,
        marker.sourceMarkerId,
        marker.parentMarkerId
      ].filter(Boolean).map(String);

      return targets.some(function(target) {
        return candidates.indexOf(target) !== -1;
      });
    }

    function normalizedMarkerMatches(item, marker) {
      return markerMatches(item, marker) || markerMatches(marker, item);
    }

    function applyMarkerCheckLocally(marker, nextValue) {
      var updatedMarker = null;
      if (ownTeam) {
        ownTeam.markers.forEach(function(item) {
          if (normalizedMarkerMatches(item, marker)) {
            item.isChecked = nextValue;

      setAdminMessage("마커 ON/OFF가 업데이트되었습니다.");
      showMarkerInfo(updatedMarker || Object.assign({}, marker, { isChecked: nextValue }));
    }

        "data share": "전송 기능은 준비 중입니다",
        "line setting": "설정 기능은 준비 중입니다",
        "line delete": "삭제 기능은 준비 중입니다",
        "add group": "마커/그룹 생성 기능은 준비 중입니다",
        "logout": "로그아웃 기능은 준비 중입니다",
        "spreadsheet upload": "Spreadsheet 업로드는 준비 중입니다",
        "cadastral": "지적편집도 기능은 준비 중입니다"
      };
      var baseName = String(actionName || "").split(":")[0];
      setAdminMessage(messages[baseName] || ("준비 중: " + actionName));
      console.log("[ADMIN_V2_UI] action placeholder", actionName);
    }

    function bindEvents() {
      document.querySelector(".sidebar").addEventListener("click", function(event) {
        event.stopPropagation();
      });
      document.getElementById("sidebarBackdrop").addEventListener("click", function(event) {
        event.preventDefault();
        event.stopPropagation();
        closeMarkerInfo();
        closeSidebar();
      });
      document.getElementById("infoCard").addEventListener("click", function(event) {
        event.stopPropagation();
      });
      document.getElementById("sidebarToggle").addEventListener("click", function(event) {
        event.preventDefault();
        event.stopPropagation();
        toggleSidebar();
      });
      document.getElementById("refreshButton").addEventListener("click", subscribeAdminTeamsRealtime);
      document.getElementById("fitBoundsButton").addEventListener("click", fitBoundsToVisibleItems);
      document.getElementById("markerMoveButton").addEventListener("click", toggleMarkerMoveMode);
      document.getElementById("cadastralButton").addEventListener("click", function() {
        handlePlaceholderAction("cadastral");
      });
      document.getElementById("addGroupButton").addEventListener("click", function() {
        handlePlaceholderAction("add group");
      });
      document.getElementById("logoutButton").addEventListener("click", function() {
        handlePlaceholderAction("logout");
      });
      document.getElementById("spreadsheetToggle").addEventListener("click", function() {
        this.classList.toggle("on");
        handlePlaceholderAction("spreadsheet upload");
      });
      document.getElementById("closeInfoButton").addEventListener("click", closeMarkerInfo);
      document.getElementById("lineToggleButton").addEventListener("click", function() {
        var body = document.getElementById("lineSectionBody");
        var hidden = body.style.display === "none";
        body.style.display = hidden ? "grid" : "none";
        this.textContent = hidden ? "-" : "+";
      });
      document.addEventListener("keydown", function(event) {
        if (event.key === "Escape") {
          closePhotoLightbox();
          closeMarkerDeleteModal();
        }
      });
    }

    function startAdminV2() {
      bindEvents();
      initFirebase();
      initKakaoMap();
    }

    startAdminV2();
  </script>
</body>
</html>
