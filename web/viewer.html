<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>현장 뷰어</title>
    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; }
        #map { width: 100%; height: 100%; }
        #loading {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; display: flex; align-items: center;
            justify-content: center; font-size: 16px; color: #555;
            font-family: sans-serif; z-index: 999;
        }
        .custom-label {
            background: white;
            border: 1.5px solid #1E88E5;
            padding: 4px 8px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 5px;
            box-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            color: #333;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div id="loading">📍 지도 불러오는 중...</div>
    <div id="map"></div>
    <script>
        window.kakaoMapInit = function() {
            var urlParams = new URLSearchParams(window.location.search);
            var dataUrl = urlParams.get('data');
            if (!dataUrl) {
                document.getElementById('loading').innerText = '❌ 마커 데이터 주소가 없습니다.';
                return;
            }
            fetch(dataUrl)
                .then(res => {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.json();
                })
                .then(data => {
                    document.getElementById('loading').style.display = 'none';
                    var map = new kakao.maps.Map(document.getElementById('map'), {
                        center: new kakao.maps.LatLng(35.1795, 129.0756),
                        level: 3
                    });
                    var bounds = new kakao.maps.LatLngBounds();
                    data.forEach(function(m) {
                        var position = new kakao.maps.LatLng(m.lat, m.lng);
                        new kakao.maps.Marker({ position: position, map: map });
                        new kakao.maps.CustomOverlay({
                            position: position,
                            content: '<div class="custom-label">' + m.title + '</div>',
                            yAnchor: 2.3
                        }).setMap(map);
                        bounds.extend(position);
                    });
                    if (data.length > 0) map.setBounds(bounds);
                })
                .catch(err => {
                    document.getElementById('loading').innerText = '❌ 데이터 로드 실패: ' + err.message;
                });
        };
    </script>
    <script type="text/javascript"
        src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=4a2743b9e49b8da391510688eb04d69d&libraries=services&autoload=false">
    </script>
    <script>
        kakao.maps.load(window.kakaoMapInit);
    </script>
</body>
</html>
